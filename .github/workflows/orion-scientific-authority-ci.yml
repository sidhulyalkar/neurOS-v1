name: ORION Scientific Authority

on:
  pull_request:
    paths:
      - "packages/orion/src/orion/scientific_authority.py"
      - "packages/orion/src/orion/scientific/**"
      - "packages/orion/src/orion/__init__.py"
      - "tests/test_orion_scientific_authority.py"
      - "tests/test_orion_scientific_result_integrity.py"
      - "examples/orion/scientific_authority_v2.py"
      - "docs/SCIENTIFIC_AUTHORITY_V2.md"
      - ".github/workflows/orion-scientific-authority-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/orion/src/orion/scientific_authority.py"
      - "packages/orion/src/orion/scientific/**"
      - "packages/orion/src/orion/__init__.py"
      - "tests/test_orion_scientific_authority.py"
      - "tests/test_orion_scientific_result_integrity.py"
      - "examples/orion/scientific_authority_v2.py"
      - "docs/SCIENTIFIC_AUTHORITY_V2.md"
      - ".github/workflows/orion-scientific-authority-ci.yml"

permissions:
  contents: read

concurrency:
  group: orion-scientific-authority-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scientific-authority:
    name: Scientific authority / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependency-light ORION profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e "packages/orion[test]"
      - name: Exercise Scientific Authority v2 contracts
        run: |
          pytest -q \
            tests/test_orion_scientific_authority.py \
            tests/test_orion_scientific_result_integrity.py \
            tests/test_orion_adaptation_integrity.py \
            tests/test_orion_assessment.py
      - name: Prove deterministic machine-readable report
        run: |
          python examples/orion/scientific_authority_v2.py > "${RUNNER_TEMP}/authority-first.json"
          python examples/orion/scientific_authority_v2.py > "${RUNNER_TEMP}/authority-second.json"
          diff -u "${RUNNER_TEMP}/authority-first.json" "${RUNNER_TEMP}/authority-second.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "authority-first.json").read_text())
          assert report["schema"] == "orion.scientific_authority.v2"
          assert len(report["study_sha256"]) == 64
          assert len(report["display_fingerprint"]) == 16
          assert report["evidence_domains"]["task_utility"]
          assert report["evidence_domains"]["hardware"] == []
          assert report["evidence_domains"]["clinical"] == []
          assert report["pretraining_overlap"][0]["status"] == "disjoint_verified"
          assert report["result_sets"][0]["status_counts"]["ok"] == 1
          assert report["target_observation_budgets"]["zero-target-observation"]["labeled_examples"] == 0
          assert report["target_observation_budgets"]["zero-target-observation"]["unlabeled_examples"] == 0
          PY
      - name: Compile scientific authority surface
        run: |
          python -m compileall -q \
            packages/orion/src/orion/scientific \
            packages/orion/src/orion/scientific_authority.py \
            examples/orion/scientific_authority_v2.py
