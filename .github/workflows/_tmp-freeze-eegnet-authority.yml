          )
          study.write_text(text, encoding="utf-8")

          tests = Path("tests/test_neural_system_qualification_baselines.py")
          text = tests.read_text(encoding="utf-8")
          old_factory = '''    factory = UpstreamBraindecodeFactory(\n        model_name="EEGNet",\n        sample_rate_hz=128.0,\n        n_epochs=1,\n        batch_size=8,\n        random_state=3,\n    )\n    spec = factory.method_spec\n    assert spec.implementation.startswith("braindecode.models.EEGNet+")\n    assert spec.metadata["neuros_model_wrapper_used"] is False\n    assert spec.probability_semantics == "uncalibrated_softmax"\n'''
          new_factory = '''    factory = UpstreamBraindecodeFactory(\n        model_name="EEGNet",\n        sample_rate_hz=128.0,\n        optimizer_name="Adam",\n        learning_rate=0.000625,\n        n_epochs=2,\n        batch_size=8,\n        random_state=3,\n        validation_fraction=0.2,\n        validation_seed=7,\n        early_stopping_patience=1,\n        restore_best=True,\n    )\n    spec = factory.method_spec\n    assert spec.implementation.startswith("braindecode.models.EEGNet+")\n    assert spec.metadata["neuros_model_wrapper_used"] is False\n    assert spec.metadata["optimizer"] == "torch.optim.Adam"\n    assert spec.metadata["train_split"] == {\n        "implementation": "skorch.dataset.ValidSplit",\n        "fraction": 0.2,\n        "stratified": False,\n        "seed": 7,\n    }\n    assert spec.metadata["state_selection"]["restore_best"] is True\n    assert spec.metadata["final_assessment_used_for_state_selection"] is False\n    assert spec.probability_semantics == "uncalibrated_softmax"\n'''
          if old_factory not in text:
              raise SystemExit("Braindecode factory test block drifted")
          text = text.replace(old_factory, new_factory, 1)
          old_exec = '''    factory = UpstreamBraindecodeFactory(\n        model_name="EEGNet",\n        sample_rate_hz=128.0,\n        n_epochs=1,\n        batch_size=8,\n        random_state=3,\n    )\n    result = run_external_qualification_case(\n'''
          new_exec = '''    factory = UpstreamBraindecodeFactory(\n        model_name="EEGNet",\n        sample_rate_hz=128.0,\n        optimizer_name="Adam",\n        learning_rate=0.000625,\n        n_epochs=2,\n        batch_size=8,\n        random_state=3,\n        validation_fraction=0.2,\n        validation_seed=7,\n        early_stopping_patience=1,\n        restore_best=True,\n    )\n    result = run_external_qualification_case(\n'''
          if old_exec not in text:
              raise SystemExit("Braindecode NSQ execution test block drifted")
          text = text.replace(old_exec, new_exec, 1)
          anchor = '''\n\ndef test_missing_upstream_braindecode_architecture_is_preserved_as_unavailable():\n'''
          state_test = '''\n\ndef test_upstream_braindecode_binds_validation_membership_and_selected_tensor_state():\n    pytest.importorskip("braindecode")\n    pytest.importorskip("torch")\n    data = _eeg_data()\n    factory = UpstreamBraindecodeFactory(\n        model_name="EEGNet",\n        sample_rate_hz=128.0,\n        optimizer_name="Adam",\n        learning_rate=0.000625,\n        n_epochs=2,\n        batch_size=8,\n        random_state=11,\n        validation_fraction=0.2,\n        validation_seed=13,\n        early_stopping_patience=1,\n        restore_best=True,\n    )\n    decoder = factory.create()\n    decoder.fit(data.X[:32], data.y[:32])\n    learned = decoder.learned_state()\n    metadata = learned.metadata\n\n    assert learned.state_identity_kind == "tensor_sha256"\n    assert learned.state_sha256 is not None\n    assert metadata["model_seed"] == 11\n    assert metadata["validation_seed"] == 13\n    assert metadata["validation_policy"] == "skorch.ValidSplit"\n    assert metadata["validation_stratified"] is False\n    assert metadata["restore_best"] is True\n    assert metadata["final_assessment_used_for_state_selection"] is False\n    assert metadata["validation_samples"] == len(metadata["validation_relative_indices"])\n    assert len(set(metadata["validation_relative_indices"])) == metadata["validation_samples"]\n    assert metadata["best_observed_epoch"] <= metadata["stopped_epoch"]\n    assert len(metadata["validation_relative_indices_sha256"]) == 64\n    assert len(metadata["train_relative_indices_sha256"]) == 64\n\n'''
          if anchor not in text:
              raise SystemExit("Braindecode state test insertion anchor drifted")
          text = text.replace(anchor, state_test + anchor, 1)
          tests.write_text(text, encoding="utf-8")

          docs = Path("docs/NSQ_KUMAR2024_V1.md")
          text = docs.read_text(encoding="utf-8")
          old_methods = '''The NSQ execution surface supports:\n\n1. direct MNE CSP + scikit-learn LDA;\n2. direct pyRiemann covariance + tangent-space + scikit-learn logistic regression;\n3. direct upstream Braindecode EEGNet;\n4. direct upstream Braindecode EEGConformer when supported by the pinned Braindecode installation and processed input geometry.\n\nThe Riemannian comparator is frozen as sample covariance (`scm`) -> `TangentSpace(metric="riemann", tsupdate=False)` -> L2 `LogisticRegression(solver="lbfgs", C=1.0, max_iter=1000)`. `tsupdate=False` is part of the evidence contract so evaluation-batch composition cannot alter the tangent reference.\n\nOnly **MNE CSP + LDA is currently part of the canonical pilot default**. The Braindecode adapters are explicit capability/integration surfaces, not yet qualified efficacy baselines. A deep baseline may enter the promoted comparison only after its fixed unit conversion, train-authorized standardization, validation/state-selection policy, optimization schedule, and neural-model seed authority are frozen and content-addressed. Until then it must be requested explicitly with `--methods`.\n'''
          new_methods = '''The promoted Kumar2024 study surface supports:\n\n1. direct MNE CSP + scikit-learn LDA;\n2. direct pyRiemann covariance + tangent-space + scikit-learn logistic regression;\n3. direct upstream Braindecode EEGNet under the frozen neural-training authority below.\n\nThe generic Braindecode adapter can still probe other installed upstream architectures, including EEGConformer when available, but **EEGConformer is not a promoted Kumar2024 efficacy method yet**. It needs its own model-appropriate training authority before entering this study.\n\nThe Riemannian comparator is frozen as sample covariance (`scm`) -> `TangentSpace(metric="riemann", tsupdate=False)` -> L2 `LogisticRegression(solver="lbfgs", C=1.0, max_iter=1000)`. `tsupdate=False` is part of the evidence contract so evaluation-batch composition cannot alter the tangent reference.\n\nThe EEGNet v1 training authority is frozen before any promoted EEGNet final-assessment result is inspected:\n\n- the same NSQ/MOABB 8–30 Hz epoch arrays used by the classical methods, with no hidden model-specific normalization;\n- direct upstream `braindecode.models.EEGNet` + `EEGClassifier`;\n- `torch.optim.Adam`, learning rate `0.000625`, weight decay `0`;\n- batch size `64`;\n- maximum `1000` epochs as a ceiling;\n- `skorch.dataset.ValidSplit(0.2, stratified=False, random_state=17011)` inside the NSQ-authorized fit set;\n- early stopping on validation loss with patience `300`, zero improvement threshold, and restoration of the best observed validation-loss module state;\n- model seed `31415`, separate from the study split seed and analysis seed;\n- deterministic cuDNN flags when CUDA is available;\n- exact validation membership recorded as relative indices plus SHA-256 in learned-state evidence;\n- the restored inference tensor/buffer state content-addressed without pickle.\n\nThe canonical CLI pilot still defaults to **MNE CSP + LDA only**. The exact-main archival classical workflow explicitly runs CSP + RG together. EEGNet must be requested explicitly and should not be executed against promoted final-assessment data until this training authority itself has passed exact-head qualification.\n'''
          if old_methods not in text:
              raise SystemExit("NSQ docs external-method section drifted")
          text = text.replace(old_methods, new_methods, 1)
          text = text.replace(
              '''`braindecode_epochs = 1` remains part of the pilot configuration only for explicit deep-adapter integration runs. It is not a qualified training recipe.\n''',
              '''The stored pilot configuration now carries the frozen EEGNet training authority above, but no deep model is part of the default pilot method set. This separates *method authority* from *whether a final-assessment run has been authorized*.\n''',
              1,
          )
          docs.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/nsq-kumar2024-ci.yml")
          text = workflow.read_text(encoding="utf-8")
          if "Upstream Braindecode EEGNet training authority" in text:
              raise SystemExit("EEGNet authority job already exists")
          job = r'''

  upstream-braindecode-eegnet-authority:
    name: Upstream Braindecode EEGNet training authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install direct upstream EEGNet evidence stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e "packages/neuros-foundation[braindecode-evidence]"
          python -m pip install pytest pytest-asyncio
      - name: Execute frozen EEGNet authority through NSQ
        run: |
          pytest -q \
            tests/test_neural_system_qualification_baselines.py::test_braindecode_factory_is_direct_upstream_not_neuros_model_wrapper \
            tests/test_neural_system_qualification_baselines.py::test_upstream_braindecode_executes_through_same_nsq_referee \
            tests/test_neural_system_qualification_baselines.py::test_upstream_braindecode_binds_validation_membership_and_selected_tensor_state
      - name: Verify frozen training identity
        run: |
          python - <<'PY'
          import importlib.metadata
          from neuros.foundation_models.qualification_baselines import UpstreamBraindecodeFactory

          factory = UpstreamBraindecodeFactory(
              model_name="EEGNet",
              sample_rate_hz=512.0,
              optimizer_name="Adam",
              learning_rate=0.000625,
              weight_decay=0.0,
              n_epochs=1000,
              batch_size=64,
              random_state=31415,
              validation_fraction=0.2,
              validation_seed=17011,
              early_stopping_patience=300,
              early_stopping_threshold=0.0,
              restore_best=True,
          )
          spec = factory.method_spec
          assert spec.method_id == "braindecode-eegnet"
          assert spec.metadata["optimizer"] == "torch.optim.Adam"
          assert spec.metadata["n_epochs_ceiling"] == 1000
          assert spec.metadata["batch_size"] == 64
          assert spec.metadata["model_seed"] == 31415
          assert spec.metadata["train_split"] == {
              "implementation": "skorch.dataset.ValidSplit",
              "fraction": 0.2,
              "stratified": False,
              "seed": 17011,
          }
          assert spec.metadata["state_selection"]["patience"] == 300
          assert spec.metadata["state_selection"]["restore_best"] is True
          assert spec.metadata["final_assessment_used_for_state_selection"] is False
          print("braindecode", importlib.metadata.version("braindecode"))
          print("torch", importlib.metadata.version("torch"))
          print("skorch", importlib.metadata.version("skorch"))
          print("method_sha256", spec.sha256)
          PY
'''
          workflow.write_text(text.rstrip() + job + "\n", encoding="utf-8")
          PY

      - name: Validate patch before committing
        run: |
          python -m compileall -q \
            packages/neuros-foundation/src/neuros/foundation_models/qualification_baselines.py \
            packages/neuros/src/neuros/evidence/kumar2024.py
          git diff --check
          grep -q 'braindecode_epochs: int = 1000' packages/neuros/src/neuros/evidence/kumar2024.py
          grep -q 'validation_relative_indices_sha256' packages/neuros-foundation/src/neuros/foundation_models/qualification_baselines.py
          grep -q 'Upstream Braindecode EEGNet training authority' .github/workflows/nsq-kumar2024-ci.yml

      - name: Commit authority changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/neuros-foundation/src/neuros/foundation_models/qualification_baselines.py \
            packages/neuros/src/neuros/evidence/kumar2024.py \
            tests/test_neural_system_qualification_baselines.py \
            docs/NSQ_KUMAR2024_V1.md \
            .github/workflows/nsq-kumar2024-ci.yml
          git commit -m "Freeze upstream EEGNet NSQ training authority"
          git push origin HEAD:${GITHUB_REF_NAME}
