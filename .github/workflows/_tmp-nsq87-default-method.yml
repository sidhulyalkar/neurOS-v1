name: One-shot NSQ87 default-method guard

on:
  push:
    branches:
      - feat/nsq-kumar2024-v1
    paths:
      - .github/workflows/_tmp-nsq87-default-method.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make CSP the only canonical pilot default
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          source = Path("packages/neuros/src/neuros/evidence/kumar2024.py")
          replace_once(
              source,
              '    methods: tuple[str, ...] = KUMAR2024_DEFAULT_METHODS\n',
              '    # Deep adapters are supported, but their efficacy preprocessing/state-selection\n'
              '    # authority is not frozen yet. Keep the canonical pilot default classical.\n'
              '    methods: tuple[str, ...] = ("mne-csp-lda",)\n',
          )

          tests = Path("tests/test_kumar2024_nsq_study.py")
          replace_once(
              tests,
              '    assert pilot.braindecode_epochs == 1\n',
              '    assert pilot.braindecode_epochs == 1\n'
              '    assert pilot.methods == ("mne-csp-lda",)\n',
          )

          docs = Path("docs/NSQ_KUMAR2024_V1.md")
          replace_once(
              docs,
              '''## External methods v1\n\nThe canonical first comparison uses:\n\n1. direct MNE CSP + scikit-learn LDA;\n2. direct upstream Braindecode EEGNet;\n3. direct upstream Braindecode EEGConformer when supported by the pinned Braindecode installation and processed input geometry.\n\nThese participate through the same NSQ factory protocol. neurOS does not substitute its own model implementation behind an external method name.\n\nEvery calibration budget creates a **fresh external model instance**. Warm-starting one point on the frontier from another point is forbidden.\n''',
              '''## External methods v1\n\nThe NSQ execution surface supports:\n\n1. direct MNE CSP + scikit-learn LDA;\n2. direct upstream Braindecode EEGNet;\n3. direct upstream Braindecode EEGConformer when supported by the pinned Braindecode installation and processed input geometry.\n\nOnly **MNE CSP + LDA is currently part of the canonical pilot default**. The Braindecode adapters are explicit capability/integration surfaces, not yet qualified efficacy baselines. A deep baseline may enter the promoted comparison only after its fixed unit conversion, train-authorized standardization, validation/state-selection policy, optimization schedule, and neural-model seed authority are frozen and content-addressed. Until then it must be requested explicitly with `--methods`.\n\nThese methods participate through the same NSQ factory protocol. neurOS does not substitute its own model implementation behind an external method name. Every calibration budget creates a **fresh external model instance**; warm-starting one frontier point from another is forbidden.\n''',
          )

          replace_once(
              docs,
              '''The default command is a provenance/execution pilot:\n\n```text\nsubjects = 1,10\nsplit seed = 2026\nbudgets = 0,1,2,5,10 / class\nBraindecode epochs = 1\n```\n''',
              '''The default command is a provenance/execution pilot:\n\n```text\nsubjects = 1,10\nsplit seed = 2026\nbudgets = 0,1,2,5,10 / class\ndefault method = MNE CSP + LDA only\n```\n\n`braindecode_epochs = 1` remains part of the pilot configuration only for explicit deep-adapter integration runs. It is not a qualified training recipe.\n''',
          )
          PY
      - name: Validate and commit
        run: |
          python -m compileall -q packages/neuros/src/neuros/evidence/kumar2024.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/neuros/src/neuros/evidence/kumar2024.py tests/test_kumar2024_nsq_study.py docs/NSQ_KUMAR2024_V1.md
          git commit -m "Keep Kumar2024 pilot baseline scientifically fair"
          git push origin HEAD:${GITHUB_REF_NAME}
