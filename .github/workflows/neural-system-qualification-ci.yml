name: Neural System Qualification v1

on:
  pull_request:
    paths:
      - "packages/neuros-foundation/src/neuros/foundation_models/qualification.py"
      - "tests/test_neural_system_qualification_v1.py"
      - "docs/NEURAL_SYSTEM_QUALIFICATION_V1.md"
      - ".github/workflows/neural-system-qualification-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/neuros-foundation/src/neuros/foundation_models/qualification.py"
      - "tests/test_neural_system_qualification_v1.py"
      - "docs/NEURAL_SYSTEM_QUALIFICATION_V1.md"
      - ".github/workflows/neural-system-qualification-ci.yml"

permissions:
  contents: read

concurrency:
  group: neural-system-qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification-contracts:
    name: Qualification contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install qualification contract profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e packages/neuros-foundation pytest pytest-asyncio
      - name: Exercise peer-facing qualification contracts
        run: |
          pytest -q tests/test_neural_system_qualification_v1.py
      - name: Prove deterministic protocol identity
        run: |
          python - <<'PY'
          from neuros.foundation_models.qualification import QualificationProtocolSpec

          lineage = "d" * 64
          first = QualificationProtocolSpec(
              protocol_id="nsq-kumar2024-mi-v1",
              dataset_id="MOABB:Kumar2024",
              dataset_lineage_sha256=lineage,
              task_id="left-vs-right-motor-imagery",
              independent_unit="participant",
              grouping_hierarchy=("participant", "session", "trial"),
              calibration_budgets_per_class=(0, 1, 2, 5, 10),
              metadata={"cohorts": ["GR", "PAR"], "status_note": "draft"},
          )
          second = QualificationProtocolSpec(
              protocol_id="nsq-kumar2024-mi-v1",
              dataset_id="MOABB:Kumar2024",
              dataset_lineage_sha256=lineage,
              task_id="left-vs-right-motor-imagery",
              independent_unit="participant",
              grouping_hierarchy=("participant", "session", "trial"),
              calibration_budgets_per_class=(0, 1, 2, 5, 10),
              metadata={"status_note": "draft", "cohorts": ["GR", "PAR"]},
          )
          assert first.sha256 == second.sha256
          assert len(first.sha256) == 64
          assert first.display_fingerprint == first.sha256[:16]
          assert first.protocol_status == "draft"
          print(first.sha256)
          PY
      - name: Compile qualification surface
        run: |
          python -m compileall -q \
            packages/neuros-foundation/src/neuros/foundation_models/qualification.py
