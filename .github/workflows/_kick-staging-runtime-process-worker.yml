name: Kick Staging Runtime Process Worker

on:
  push:
    branches:
      - staging/runtime-process-worker-v1
    paths:
      - .staging/runtime-process-worker.trigger

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch staging integration harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run _staging-runtime-process-worker-v1.yml --repo sidhulyalkar/neurOS-v1 --ref staging/runtime-process-worker-v1
