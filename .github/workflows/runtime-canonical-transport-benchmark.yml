name: Runtime Canonical Transport Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-canonical-transport-benchmark.yml"
      - "scripts/benchmark_runtime_canonical_transport.py"

permissions:
  contents: read

env:
  BENCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BENCH_SEMANTIC_SHA: d5e16588f2b6e1abc256ad47ccb943d32c641531

concurrency:
  group: runtime-canonical-transport-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Canonical non-gating benchmark / ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BENCH_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact clean benchmark source and frozen runtime semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BENCH_SOURCE_SHA}"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          git cat-file -e "${BENCH_SEMANTIC_SHA}^{commit}"
          git diff --quiet "${BENCH_SEMANTIC_SHA}" HEAD -- packages/neuros-core/src

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/neuros-core/pyproject.toml

      - name: Install benchmark runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip check

      - name: Measure realistic canonical transport workloads
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark_runtime_canonical_transport.py \
            --payload-bytes 16384 262144 1048576 8388608 \
            --output canonical-transport-benchmark.json

      - name: Validate evidence binding and publish support-aware summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          payload = json.loads(
              Path("canonical-transport-benchmark.json").read_text(encoding="utf-8")
          )
          if payload.get("schema") != "neuros.runtime_canonical_transport_benchmark.v2":
              raise SystemExit("unexpected benchmark schema")
          if payload.get("source_revision") != os.environ["BENCH_SOURCE_SHA"]:
              raise SystemExit("benchmark source revision mismatch")
          if payload.get("semantic_source_revision") != os.environ["BENCH_SEMANTIC_SHA"]:
              raise SystemExit("benchmark semantic revision mismatch")

          support = {
              (row["workload"], row["target_array_bytes"], row["transport"]): row
              for row in payload["support"]
          }
          timings = {
              (row["workload"], row["target_array_bytes"], row["transport"]): row
              for row in payload["summary"]
          }

          required_workloads = {"ndarray", "signal_frame", "neural_window", "decoder_output"}
          if {row["workload"] for row in payload["support"]} != required_workloads:
              raise SystemExit("canonical workload set mismatch")

          for size in payload["target_array_sizes"]:
              if not support[("ndarray", size, "pickle")]["supported"]:
                  raise SystemExit("pickle ndarray support regressed")
              for workload in required_workloads:
                  if not support[(workload, size, "shared_memory")]["supported"]:
                      raise SystemExit(f"shared-memory support regressed for {workload}")
                  if (workload, size, "shared_memory") not in timings:
                      raise SystemExit(f"missing shared-memory timing for {workload}")

          lines = [
              "## Canonical runtime transport benchmark\n\n",
              f"Runner: `{platform.platform()}`  \n",
              f"Semantic source: `{os.environ['BENCH_SEMANTIC_SHA']}`  \n",
              f"Benchmark source: `{os.environ['BENCH_SOURCE_SHA']}`  \n",
              "Descriptive and non-gating. Unsupported means representation cannot "
              "cross that transport without changing the canonical object.\n\n",
              "| Workload | Numeric bytes | Pickle | Shared p50 ms | Shared p95 ms | Manifest bytes |\n",
              "|---|---:|---|---:|---:|---:|\n",
          ]
          for size in payload["target_array_sizes"]:
              for workload in sorted(required_workloads):
                  pickle = support[(workload, size, "pickle")]
                  shared = timings[(workload, size, "shared_memory")]
                  pickle_label = "supported"
                  if not pickle["supported"]:
                      reason = pickle["unsupported_reason"].split(":", 1)[0]
                      pickle_label = f"unsupported ({reason})"
                  lines.append(
                      f"| {workload} | {shared['numeric_array_bytes']:,} | {pickle_label} | "
                      f"{shared['p50_ms']:.3f} | {shared['p95_ms']:.3f} | "
                      f"{shared['shared_manifest_json_bytes']:,} |\n"
                  )

          ndarray_sizes = payload["target_array_sizes"]
          lines.extend(
              [
                  "\n### Comparable ndarray crossover\n\n",
                  "| Numeric bytes | Pickle p50 ms | Shared p50 ms | Pickle/Shared speedup |\n",
                  "|---:|---:|---:|---:|\n",
              ]
          )
          for size in ndarray_sizes:
              pickle = timings[("ndarray", size, "pickle")]
              shared = timings[("ndarray", size, "shared_memory")]
              speedup = pickle["p50_ms"] / shared["p50_ms"]
              lines.append(
                  f"| {size:,} | {pickle['p50_ms']:.3f} | {shared['p50_ms']:.3f} | "
                  f"{speedup:.2f}× |\n"
              )

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "".join(lines), encoding="utf-8"
          )
          PY

      - name: Upload immutable canonical benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-canonical-transport-benchmark-${{ matrix.os }}-${{ env.BENCH_SOURCE_SHA }}
          path: canonical-transport-benchmark.json
          if-no-files-found: error
          retention-days: 30
