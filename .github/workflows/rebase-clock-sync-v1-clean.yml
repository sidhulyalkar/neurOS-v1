name: Rebase Clock Sync V1 Clean

on:
  push:
    branches:
      - automation/rebase-clock-sync-v1-clean

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Reconstruct the already-qualified semantic integration
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="snapshot/rust-clock-sync-v1-d894bc"
          ORCHESTRATOR="automation/rebase-clock-sync-v1-c6dd"

          git config user.name "neurOS integration bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${SNAPSHOT}:refs/remotes/origin/${SNAPSHOT}" \
            "+refs/heads/${ORCHESTRATOR}:refs/remotes/origin/${ORCHESTRATOR}" \
            --force

          BASE="$(git rev-parse origin/main)"
          git show "origin/${ORCHESTRATOR}:.github/workflows/rebase-clock-sync-v1.yml" > /tmp/orchestrator.yml

          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          text = Path("/tmp/orchestrator.yml").read_text()
          blocks = re.findall(
              r"^          python - <<'PY'\n(.*?)^          PY\n",
              text,
              flags=re.MULTILINE | re.DOTALL,
          )
          if len(blocks) != 2:
              raise SystemExit(f"expected exactly two qualified Python blocks, found {len(blocks)}")
          Path("/tmp/semantic_integrate.py").write_text(textwrap.dedent(blocks[0]))
          Path("/tmp/integration_smoke.py").write_text(textwrap.dedent(blocks[1]))
          PY

          git checkout -B clock-sync-rebase origin/main
          git merge --no-commit --no-ff -Xours "origin/${SNAPSHOT}"
          git checkout "origin/${SNAPSHOT}" -- \
            docs/EXACT_ALIGNMENT_V1.md \
            packages/neuros/src/neuros/__init__.py \
            rust/neuros-runtime/src/sync.rs
          python /tmp/semantic_integrate.py

          printf '%s\n' "${BASE}" > /tmp/base_sha

      - name: Requalify Rust and Python integration
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p neuros-runtime --all-features
          python -m compileall -q packages/neuros/src/neuros/dataset.py

          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0"
          maturin build --release --manifest-path rust/neuros-runtime-py/Cargo.toml --interpreter python
          python -m pip install target/wheels/*.whl
          python /tmp/integration_smoke.py

      - name: Strip merge ancestry and publish one-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/base_sha)"

          # Preserve the exact tree that just passed qualification, but discard
          # the temporary merge parent. The frozen snapshot contains old history
          # flagged by push protection and must never become candidate ancestry.
          git diff --binary "${BASE}" -- > /tmp/qualified.patch
          test -s /tmp/qualified.patch
          git reset --hard "${BASE}"
          git apply --index /tmp/qualified.patch

          git diff --cached --check

          EXPECTED=$(cat <<'EOF'
          .github/workflows/rust-runtime-ci.yml
          docs/EXACT_ALIGNMENT_V1.md
          packages/neuros/src/neuros/__init__.py
          packages/neuros/src/neuros/dataset.py
          rust/neuros-runtime-py/src/lib.rs
          rust/neuros-runtime/src/content_identity.rs
          rust/neuros-runtime/src/dataset.rs
          rust/neuros-runtime/src/error.rs
          rust/neuros-runtime/src/lib.rs
          rust/neuros-runtime/src/manifest.rs
          rust/neuros-runtime/src/sync.rs
          EOF
          )
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED_SORTED="$(printf '%s\n' "${EXPECTED}" | sed 's/^ *//' | sort)"
          if [ "${ACTUAL}" != "${EXPECTED_SORTED}" ]; then
            echo "Unexpected candidate surface"
            echo "Expected:"
            printf '%s\n' "${EXPECTED_SORTED}"
            echo "Actual:"
            printf '%s\n' "${ACTUAL}"
            exit 1
          fi

          git commit -m "feat(runtime): integrate exact-clock planning with provenance authority"

          test "$(git rev-parse HEAD^)" = "${BASE}"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF}')" -eq 2
          test "$(git diff --name-only "${BASE}" HEAD | sort)" = "${EXPECTED_SORTED}"

          git push --force origin HEAD:automation/clock-sync-v1-rebased-output
          echo "candidate_sha=$(git rev-parse HEAD)"
