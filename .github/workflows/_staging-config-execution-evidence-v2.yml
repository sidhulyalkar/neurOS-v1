name: Staging Config Execution Evidence V2

on:
  push:
    branches:
      - staging/config-execution-evidence-v2
    paths:
      - ".github/workflows/_staging-config-execution-evidence-v2.yml"
      - ".staging/config_execution_evidence_patch.py"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging/config-execution-evidence-v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply deterministic executor patch
        run: python .staging/config_execution_evidence_patch.py

      - name: Compile authority surface
        run: |
          python -m compileall -q \
            packages/neuros-core/src/neuros/runtime/_execution_evidence.py \
            packages/neuros-core/src/neuros/runtime/executor.py \
            packages/neuros-core/src/neuros/config

      - name: Install core qualification surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip check

      - name: Exercise execution evidence contracts
        run: |
          python -m pytest -q \
            tests/test_runtime_execution_evidence.py \
            tests/test_config_execution_authority.py \
            tests/test_runtime_execution_authority.py \
            tests/test_runtime_process_authority.py \
            tests/test_runtime_process_provenance.py \
            tests/test_runtime_graph_authority.py

      - name: Persist validated executor blob
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/neuros-core/src/neuros/runtime/executor.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(runtime): stage resolved execution evidence"
          git push origin HEAD:staging/config-execution-evidence-v2
