name: Runtime Fault Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-fault-qualification.yml"
      - "docs/RUNTIME_PROCESS_TRANSPORT.md"
      - "packages/neuros-core/src/neuros/contracts/window.py"
      - "packages/neuros-core/src/neuros/runtime/**"
      - "packages/neuros-core/pyproject.toml"
      - "tests/test_runtime_executor.py"
      - "tests/test_runtime_queues.py"
      - "tests/test_runtime_fault_qualification.py"
      - "tests/test_runtime_fusion_cancellation.py"
      - "tests/test_runtime_execution_authority.py"
      - "tests/test_runtime_process_authority.py"
      - "tests/test_runtime_neural_transport.py"
      - "tests/test_runtime_shared_transport_integration.py"
      - "tests/test_runtime_transport_protocol_corruption.py"
      - "tests/test_runtime_process_provenance.py"
      - "tests/test_runtime_process_transport_parity.py"
      - "tests/test_runtime_duration_authority.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-fault-qualification.yml"
      - "docs/RUNTIME_PROCESS_TRANSPORT.md"
      - "packages/neuros-core/src/neuros/contracts/window.py"
      - "packages/neuros-core/src/neuros/runtime/**"
      - "packages/neuros-core/pyproject.toml"
      - "tests/test_runtime_executor.py"
      - "tests/test_runtime_queues.py"
      - "tests/test_runtime_fault_qualification.py"
      - "tests/test_runtime_fusion_cancellation.py"
      - "tests/test_runtime_execution_authority.py"
      - "tests/test_runtime_process_authority.py"
      - "tests/test_runtime_neural_transport.py"
      - "tests/test_runtime_shared_transport_integration.py"
      - "tests/test_runtime_transport_protocol_corruption.py"
      - "tests/test_runtime_process_provenance.py"
      - "tests/test_runtime_process_transport_parity.py"
      - "tests/test_runtime_duration_authority.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FAULT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONASYNCIODEBUG: "1"

concurrency:
  group: runtime-fault-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fault-matrix:
    name: Fault containment / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
        python:
          - "3.10"
          - "3.11"
          - "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.FAULT_SOURCE_SHA }}
          persist-credentials: false

      - name: Require exact clean qualification source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FAULT_SOURCE_SHA}"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/neuros-core/pyproject.toml

      - name: Install runtime qualification surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip check

      - name: Exercise runtime and queue fault contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_runtime_executor.py \
            tests/test_runtime_queues.py \
            tests/test_runtime_fault_qualification.py \
            tests/test_runtime_fusion_cancellation.py \
            tests/test_runtime_execution_authority.py \
            tests/test_runtime_process_authority.py \
            tests/test_runtime_neural_transport.py \
            tests/test_runtime_shared_transport_integration.py \
            tests/test_runtime_transport_protocol_corruption.py \
            tests/test_runtime_process_provenance.py \
            tests/test_runtime_process_transport_parity.py \
            tests/test_runtime_duration_authority.py

  runtime-fault-qualification:
    name: Runtime Fault Qualification
    if: always()
    needs:
      - fault-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every cross-platform fault lane
        env:
          MATRIX_RESULT: ${{ needs.fault-matrix.result }}
        run: |
          set -euo pipefail
          test "${MATRIX_RESULT}" = "success"
