name: NSQ Kumar2024 GPU fleet contracts

on:
  pull_request:
    paths:
      - "packages/neuros/src/neuros/evidence/kumar2024_gpu_fleet.py"
      - "tests/test_kumar2024_gpu_fleet.py"
      - ".github/workflows/nsq-kumar2024-gpu-fleet-ci.yml"
      - "docs/NSQ_KUMAR2024_GPU_FLEET.md"
  push:
    branches: [main]
    paths:
      - "packages/neuros/src/neuros/evidence/kumar2024_gpu_fleet.py"
      - "tests/test_kumar2024_gpu_fleet.py"
      - ".github/workflows/nsq-kumar2024-gpu-fleet-ci.yml"
      - "docs/NSQ_KUMAR2024_GPU_FLEET.md"

permissions:
  contents: read

env:
  QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fleet-contracts:
    name: Fleet authority contracts / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
      - name: Require exact clean qualification source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SHA}"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - name: Install pinned test harness
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"
      - name: Compile fleet authority
        run: |
          python -m compileall -q \
            packages/neuros/src/neuros/evidence/kumar2024_gpu_fleet.py \
            tests/test_kumar2024_gpu_fleet.py
      - name: Run score-blind fleet adversarial tests
        run: python -m pytest -q tests/test_kumar2024_gpu_fleet.py
      - name: Require dependency-light control plane
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("packages/neuros/src/neuros/evidence/kumar2024_gpu_fleet.py")
          text = path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          allowed = {
              "__future__",
              "collections.abc",
              "dataclasses",
              "hashlib",
              "json",
              "math",
              "os",
              "pathlib",
              "typing",
          }
          observed = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  observed.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  observed.add(node.module or "")
          assert observed <= allowed, sorted(observed - allowed)
          for forbidden_file in ("case_result.json", "shard_result.json"):
              assert forbidden_file not in text, forbidden_file
          assert "torch" not in observed
          assert "kumar2024_gpu_cloud" not in text
          PY
