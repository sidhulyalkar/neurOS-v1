name: NSQ Kumar2024 external transport

on:
  pull_request:
    paths:
      - "scripts/evidence/run_kumar2024_external_qualification.sh"
      - "scripts/evidence/launch_kumar2024_brev_cpu.sh"
      - "scripts/evidence/verify_kumar2024_external_qualification.py"
      - "tests/test_kumar2024_external_qualification_verifier.py"
      - "docs/NSQ_KUMAR2024_EXTERNAL_EXECUTION.md"
      - "docs/NSQ_KUMAR2024_BREV_RUNBOOK.md"
      - ".github/workflows/nsq-kumar2024-external-transport-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/evidence/run_kumar2024_external_qualification.sh"
      - "scripts/evidence/launch_kumar2024_brev_cpu.sh"
      - "scripts/evidence/verify_kumar2024_external_qualification.py"
      - "tests/test_kumar2024_external_qualification_verifier.py"
      - "docs/NSQ_KUMAR2024_EXTERNAL_EXECUTION.md"
      - "docs/NSQ_KUMAR2024_BREV_RUNBOOK.md"
      - ".github/workflows/nsq-kumar2024-external-transport-ci.yml"

permissions:
  contents: read

concurrency:
  group: nsq-kumar2024-external-transport-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  transport-contracts:
    name: External transport contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse external worker transport shell
        run: bash -n scripts/evidence/run_kumar2024_external_qualification.sh
      - name: Parse NVIDIA Brev control-plane shell
        run: bash -n scripts/evidence/launch_kumar2024_brev_cpu.sh
      - name: Compile independent verifier
        run: python -m compileall -q scripts/evidence/verify_kumar2024_external_qualification.py
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1" "pytest-asyncio==1.4.0"
      - name: Run adversarial external-evidence tests
        run: python -m pytest -q tests/test_kumar2024_external_qualification_verifier.py
