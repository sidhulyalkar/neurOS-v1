name: Staging Representation Evidence Semantics v2

on:
  push:
    branches:
      - staging/representation-evidence-semantics-v2
    paths:
      - ".github/workflows/staging-representation-cases.yml"
      - "packages/neuros-mechint/src/neuros_mechint/representations/**"
      - "packages/neuros-mechint/tests/test_mechint_representation_cases.py"
      - "packages/neuros-mechint/tests/test_mechint_representation_sweep.py"
      - "packages/neuros-mechint/examples/12_representation_noise_sweep.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require exact clean staging source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/neuros-core/pyproject.toml
            packages/neuros-mechint/pyproject.toml
      - name: Install evidence-authority surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip install -e packages/neuros-mechint
          python -m pip check
      - name: Compile representation authority
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            packages/neuros-mechint/src/neuros_mechint/representations/contracts.py \
            packages/neuros-mechint/src/neuros_mechint/representations/pca.py \
            packages/neuros-mechint/src/neuros_mechint/representations/autoencoder.py \
            packages/neuros-mechint/src/neuros_mechint/representations/tphate.py \
            packages/neuros-mechint/src/neuros_mechint/representations/external.py \
            packages/neuros-mechint/src/neuros_mechint/representations/cases.py \
            packages/neuros-mechint/src/neuros_mechint/representations/synthetic.py \
            packages/neuros-mechint/src/neuros_mechint/representations/sweep.py \
            packages/neuros-mechint/examples/12_representation_noise_sweep.py
      - name: Exercise representation authority adversaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            packages/neuros-mechint/tests/test_mechint_representations.py \
            packages/neuros-mechint/tests/test_mechint_representation_authority.py \
            packages/neuros-mechint/tests/test_mechint_representation_cases.py \
            packages/neuros-mechint/tests/test_mechint_representation_sweep.py
      - name: Exercise v2 controlled multi-seed evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/representation-sweep-v2.json"
          python packages/neuros-mechint/examples/12_representation_noise_sweep.py \
            --noise-levels 0.0,0.35,0.75 \
            --seeds 0,1,2 \
            --components 3 \
            --ae-epochs 3 \
            --model-seed 17 > "${OUT}"
          python - "${OUT}" <<'PY'
          import json
          import math
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert payload["schema"] == "neuros.representation.controlled_noise_sweep.v2"
          assert payload["metadata"]["ranking_policy"] == "none"
          assert payload["noise_levels"] == [0.0, 0.35, 0.75]
          assert payload["seeds"] == [0, 1, 2]
          assert payload["method_ids"] == ["pca", "autoencoder", "tphate"]
          assert len(payload["records"]) == 27
          assert len(payload["summaries"]) == 9

          records = payload["records"]
          pca = [r for r in records if r["method_id"] == "pca"]
          ae = [r for r in records if r["method_id"] == "autoencoder"]
          tphate = [r for r in records if r["method_id"] == "tphate"]
          assert len(pca) == len(ae) == len(tphate) == 9
          assert all(r["status"] == "ok" for r in pca + ae)
          assert all(r["evaluation_scope"] == "batch_transform" for r in pca + ae)
          assert all(r["status"] == "unavailable" for r in tphate)
          assert all(r["evaluation_scope"] == "sequence_local" for r in tphate)
          assert all(r["metrics"] == {} for r in tphate)
          assert all(r["error_type"] == "TPHATEUnavailableError" for r in tphate)

          summaries = {
              (row["method_id"], row["noise_std"]): row
              for row in payload["summaries"]
          }
          for method_id in ("pca", "autoencoder"):
              for noise in (0.0, 0.35, 0.75):
                  row = summaries[(method_id, noise)]
                  assert row["total_cases"] == 3
                  assert row["ok_cases"] == 3
                  assert row["non_ok_rate"] == 0.0
                  assert row["failed_rate"] == 0.0
                  assert row["unavailable_rate"] == 0.0
                  assert row["nonconverged_rate"] == 0.0
                  assert "failure_rate" not in row
                  assert row["metric_n"]["reference_pairwise_distance_rank"] == 3
                  value = row["metric_mean"]["reference_pairwise_distance_rank"]
                  assert math.isfinite(value)
                  assert math.isfinite(row["metric_sem"]["reference_pairwise_distance_rank"])
          for noise in (0.0, 0.35, 0.75):
              row = summaries[("tphate", noise)]
              assert row["total_cases"] == 3
              assert row["unavailable_cases"] == 3
              assert row["non_ok_rate"] == 1.0
              assert row["unavailable_rate"] == 1.0
              assert row["failed_rate"] == 0.0
              assert row["nonconverged_rate"] == 0.0
              assert row["metric_n"] == {}

          diagnostics = {
              method: {
                  str(noise): summaries[(method, noise)]["metric_mean"].get(
                      "reference_pairwise_distance_rank"
                  )
                  for noise in (0.0, 0.35, 0.75)
              }
              for method in ("pca", "autoencoder")
          }
          print("SWEEP_V2_DIAGNOSTICS=" + json.dumps(diagnostics, sort_keys=True))
          PY
