name: Staging Representation Case Authority

on:
  push:
    branches:
      - staging/representation-cases-sweep-v1
    paths:
      - ".github/workflows/staging-representation-cases.yml"
      - "packages/neuros-mechint/src/neuros_mechint/representations/**"
      - "packages/neuros-mechint/tests/test_mechint_representation_cases.py"
      - "packages/neuros-mechint/tests/test_mechint_representation_sweep.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/neuros-core/pyproject.toml
            packages/neuros-mechint/pyproject.toml
      - name: Install case-authority surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip install -e packages/neuros-mechint
          python -m pip check
      - name: Compile case and sweep authority
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            packages/neuros-mechint/src/neuros_mechint/representations/cases.py \
            packages/neuros-mechint/src/neuros_mechint/representations/synthetic.py \
            packages/neuros-mechint/src/neuros_mechint/representations/sweep.py
      - name: Exercise representation authority adversary
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            packages/neuros-mechint/tests/test_mechint_representations.py \
            packages/neuros-mechint/tests/test_mechint_representation_authority.py \
            packages/neuros-mechint/tests/test_mechint_representation_cases.py \
            packages/neuros-mechint/tests/test_mechint_representation_sweep.py
