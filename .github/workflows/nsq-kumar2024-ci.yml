name: NSQ Kumar2024 v1

on:
  pull_request:
    paths:
      - "packages/neuros-foundation/pyproject.toml"
      - "packages/neuros-foundation/src/neuros/foundation_models/moabb_epochs.py"
      - "packages/neuros-foundation/src/neuros/foundation_models/materialization_authority.py"
      - "packages/neuros-foundation/src/neuros/foundation_models/moabb_materialization.py"
      - "packages/neuros-foundation/src/neuros/foundation_models/qualification_baselines.py"
      - "packages/neuros/src/neuros/evidence/**"
      - "packages/neuros/pyproject.toml"
      - "tests/test_moabb_epoch_evidence.py"
      - "tests/test_kumar2024_nsq_study.py"
      - "tests/test_kumar2024_comparison_authority.py"
      - "tests/test_kumar2024_promoted_execution_authority.py"
      - "tests/test_neural_system_qualification_baselines.py"
      - "docs/NSQ_KUMAR2024_V1.md"
      - ".github/workflows/nsq-kumar2024-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/neuros-foundation/pyproject.toml"
      - "packages/neuros-foundation/src/neuros/foundation_models/moabb_epochs.py"
      - "packages/neuros-foundation/src/neuros/foundation_models/materialization_authority.py"
      - "packages/neuros-foundation/src/neuros/foundation_models/moabb_materialization.py"
      - "packages/neuros-foundation/src/neuros/foundation_models/qualification_baselines.py"
      - "packages/neuros/src/neuros/evidence/**"
      - "packages/neuros/pyproject.toml"
      - "tests/test_moabb_epoch_evidence.py"
      - "tests/test_kumar2024_nsq_study.py"
      - "tests/test_kumar2024_comparison_authority.py"
      - "tests/test_kumar2024_promoted_execution_authority.py"
      - "tests/test_neural_system_qualification_baselines.py"
      - "docs/NSQ_KUMAR2024_V1.md"
      - ".github/workflows/nsq-kumar2024-ci.yml"

permissions:
  contents: read

concurrency:
  group: nsq-kumar2024-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-contracts:
    name: Kumar2024 authority / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install cross-plane authority stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-drivers
          python -m pip install -e packages/neuros-models
          python -m pip install -e packages/neuros-foundation
          python -m pip install -e packages/orion
          python -m pip install -e packages/neuros pytest pytest-asyncio
      - name: Run Kumar2024 authority and bundle tests
        run: |
          pytest -q \
            tests/test_moabb_epoch_evidence.py \
            tests/test_study_materialization_authority.py \
            tests/test_moabb_materialization_authority.py \
            tests/test_kumar2024_materialization_roles.py \
            tests/test_kumar2024_bundle_v2.py \
            tests/test_kumar2024_nsq_study.py \
            tests/test_kumar2024_comparison_authority.py \
            tests/test_kumar2024_promoted_execution_authority.py \
            tests/test_neural_system_qualification_runner.py
      - name: Compile evidence surface
        run: |
          python -m compileall -q \
            packages/neuros-foundation/src/neuros/foundation_models/moabb_epochs.py \
            packages/neuros-foundation/src/neuros/foundation_models/materialization_authority.py \
            packages/neuros-foundation/src/neuros/foundation_models/moabb_materialization.py \
            packages/neuros/src/neuros/evidence/kumar2024.py \
            packages/neuros/src/neuros/evidence/kumar2024_materialization.py \
            packages/neuros/src/neuros/evidence/kumar2024_materialized_study.py \
            packages/neuros/src/neuros/evidence/kumar2024_comparison.py \
            packages/neuros/src/neuros/evidence/kumar2024_promoted_execution.py

  upstream-moabb-contract:
    name: Current MOABB processed-epoch contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MOABB evidence profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e "packages/neuros-foundation[evidence]"
      - name: Verify upstream API without downloading participant data
        run: |
          python - <<'PY'
          import inspect
          import importlib.metadata
          from moabb.datasets import Kumar2024
          from moabb.paradigms import LeftRightImagery

          dataset = Kumar2024()
          paradigm = LeftRightImagery(fmin=8.0, fmax=30.0, resample=None)
          signature = inspect.signature(paradigm.get_data)
          assert "return_epochs" in signature.parameters
          assert list(dataset.subject_list) == list(range(1, 19))
          assert dataset.n_sessions == 6
          print("moabb", importlib.metadata.version("moabb"))
          print("return_epochs", signature.parameters["return_epochs"].default)
          PY

  riemann-baseline-contract:
    name: Upstream pyRiemann RG+LR NSQ contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Riemannian evidence stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e "packages/neuros-foundation[evidence]"
          python -m pip install pytest pytest-asyncio
      - name: Execute RG+LR through production NSQ referee
        run: |
          pytest -q \
            tests/test_neural_system_qualification_baselines.py::test_pyriemann_rg_lr_participates_without_transductive_test_update
      - name: Verify frozen upstream identity
        run: |
          python - <<'PY'
          import importlib.metadata
          from neuros.foundation_models.qualification_baselines import (
              RiemannianTangentLogRegFactory,
          )

          factory = RiemannianTangentLogRegFactory()
          spec = factory.method_spec
          assert spec.method_id == "pyriemann-rg-lr"
          assert spec.metadata["covariance_estimator"] == "scm"
          assert spec.metadata["tangent_metric"] == "riemann"
          assert spec.metadata["tangent_space_update"] is False
          assert spec.metadata["transductive_evaluation_batch_update"] is False
          assert spec.metadata["logistic_solver"] == "lbfgs"
          assert spec.metadata["logistic_penalty"] == "l2"
          assert spec.metadata["logistic_c"] == 1.0
          assert spec.metadata["logistic_max_iter"] == 1000
          print("pyriemann", importlib.metadata.version("pyriemann"))
          print("method_sha256", spec.sha256)
          PY

  upstream-braindecode-eegnet-authority:
    name: Upstream Braindecode EEGNet training authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install direct upstream EEGNet evidence stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e "packages/neuros-foundation[braindecode-evidence]"
          python -m pip install pytest pytest-asyncio
      - name: Execute frozen EEGNet authority through NSQ
        run: |
          pytest -q \
            tests/test_neural_system_qualification_baselines.py::test_braindecode_factory_is_direct_upstream_not_neuros_model_wrapper \
            tests/test_neural_system_qualification_baselines.py::test_upstream_braindecode_executes_through_same_nsq_referee \
            tests/test_neural_system_qualification_baselines.py::test_upstream_braindecode_binds_validation_membership_and_selected_tensor_state
      - name: Verify frozen training identity
        run: |
          python - <<'PY'
          import importlib.metadata
          from neuros.foundation_models.qualification_baselines import UpstreamBraindecodeFactory

          factory = UpstreamBraindecodeFactory(
              model_name="EEGNet",
              sample_rate_hz=512.0,
              optimizer_name="Adam",
              learning_rate=0.000625,
              weight_decay=0.0,
              n_epochs=1000,
              batch_size=64,
              random_state=31415,
              validation_fraction=0.2,
              validation_seed=17011,
              early_stopping_patience=300,
              early_stopping_threshold=0.0,
              restore_best=True,
          )
          spec = factory.method_spec
          assert spec.method_id == "braindecode-eegnet"
          assert spec.metadata["optimizer"] == "torch.optim.Adam"
          assert spec.metadata["n_epochs_ceiling"] == 1000
          assert spec.metadata["batch_size"] == 64
          assert spec.metadata["model_seed"] == 31415
          assert spec.metadata["train_split"] == {
              "implementation": "skorch.dataset.ValidSplit",
              "fraction": 0.2,
              "stratified": False,
              "seed": 17011,
          }
          assert spec.metadata["state_selection"]["patience"] == 300
          assert spec.metadata["state_selection"]["restore_best"] is True
          assert spec.metadata["final_assessment_used_for_state_selection"] is False
          print("braindecode", importlib.metadata.version("braindecode"))
          print("torch", importlib.metadata.version("torch"))
          print("skorch", importlib.metadata.version("skorch"))
          print("method_sha256", spec.sha256)
          PY
