name: Bootstrap native aligned executor

on:
  push:
    branches:
      - feat/rust-aligned-execution-v1

permissions:
  contents: write

jobs:
  integrate-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Wire aligned executor into qualified data plane
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/neuros-runtime/src/dataset.rs")
          text = path.read_text()

          manifest_method = '''    pub fn manifest(&self) -> &DatasetManifest {
                  &self.manifest
              }
          '''
          records_method = '''
              pub(crate) fn records(&self) -> &[Arc<Record>] {
                  &self.records
              }
          '''
          assert "pub(crate) fn records(&self)" not in text
          text = text.replace(manifest_method, manifest_method + records_method, 1)

          verify_end = '''        *state = Some(expected_dataset_sha256.clone());
                  Ok(Some(expected_dataset_sha256))
              }

              pub fn plan_windows(
          '''
          fresh_verify = '''        *state = Some(expected_dataset_sha256.clone());
                  Ok(Some(expected_dataset_sha256))
              }

              /// Re-hash every declared source even when a prior verification cache exists.
              ///
              /// Exact aligned execution uses this at worker authorization time so a source
              /// changed after planning cannot inherit an older cached verification result.
              pub(crate) fn verify_content_fresh(&self) -> Result<Option<String>> {
                  let Some(expected_dataset_sha256) = self.declared_dataset_content_sha256.clone()
                  else {
                      return Ok(None);
                  };

                  let mut records: Vec<_> = self.records.iter().collect();
                  records.sort_by(|left, right| left.id.cmp(&right.id));
                  let mut verified_regions = Vec::new();
                  for record in records {
                      let expected_source_sha256 = record.source_sha256.as_deref().ok_or_else(|| {
                          RuntimeError::Validation(
                              "declared dataset content identity requires every record source hash"
                                  .into(),
                          )
                      })?;
                      let (path, required_end) = self.resolve_record_source(record)?;
                      let (region, _) = self.map_source(&path, None)?;
                      let mapped_size = mapped_size_bytes(&region)?;
                      if mapped_size < required_end {
                          return Err(RuntimeError::SourceTooShort {
                              path,
                              actual: mapped_size,
                              required: required_end,
                          });
                      }
                      let actual =
                          Self::verify_mapped_sha256(&path, &region.mmap, expected_source_sha256)?;
                      let mut state = region.verified_source_sha256.lock().map_err(|_| {
                          RuntimeError::Validation(
                              "source verification cache lock was poisoned".into(),
                          )
                      })?;
                      *state = Some(actual);
                      drop(state);
                      verified_regions.push(region);
                  }

                  let mut state = self.verified_dataset_content_sha256.lock().map_err(|_| {
                      RuntimeError::Validation("dataset verification state lock was poisoned".into())
                  })?;
                  *state = Some(expected_dataset_sha256.clone());
                  Ok(Some(expected_dataset_sha256))
              }

              pub fn plan_windows(
          '''
          assert "pub(crate) fn verify_content_fresh" not in text
          assert verify_end in text
          text = text.replace(verify_end, fresh_verify, 1)

          open_marker = '''    fn open_window(&self, descriptor: WindowDescriptor) -> Result<WindowHandle> {
          '''
          open_record = '''    pub(crate) fn open_record_window(
                  &self,
                  record: Arc<Record>,
                  start_frame: usize,
                  length_frames: usize,
              ) -> Result<WindowHandle> {
                  if length_frames == 0 {
                      return Err(RuntimeError::InvalidWindow(
                          "aligned child window length must be positive".into(),
                      ));
                  }
                  let end_frame_exclusive = start_frame.checked_add(length_frames).ok_or_else(|| {
                      RuntimeError::InvalidWindow(
                          "aligned child frame extent overflowed usize".into(),
                      )
                  })?;
                  if end_frame_exclusive > record.shape[0] {
                      return Err(RuntimeError::InvalidWindow(format!(
                          "aligned child window [{start_frame}, {end_frame_exclusive}) exceeds record {:?} with {} frames",
                          record.id, record.shape[0]
                      )));
                  }
                  let frame_elements = record.frame_elements()?;
                  self.open_window(WindowDescriptor {
                      record,
                      start_frame,
                      length_frames,
                      frame_elements,
                  })
              }

          '''
          assert "pub(crate) fn open_record_window" not in text
          text = text.replace(open_marker, open_record + open_marker, 1)
          path.write_text(text)

          lib = Path("rust/neuros-runtime/src/lib.rs")
          text = lib.read_text()
          assert "mod aligned;" not in text
          text = text.replace("mod content_identity;\n", "mod aligned;\nmod content_identity;\n", 1)
          export_marker = "pub use content_identity::{DATASET_CONTENT_DOMAIN, declared_dataset_content_sha256};\n"
          text = text.replace(
              export_marker,
              "pub use aligned::{AlignedBatch, AlignedBatchStream};\n" + export_marker,
              1,
          )
          lib.write_text(text)
          PY

      - name: Qualify native executor
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p neuros-runtime --all-features

      - name: Publish native executor tranche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "neurOS integration bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bootstrap-native-aligned-executor.yml
          git add rust/neuros-runtime/src/aligned.rs rust/neuros-runtime/src/dataset.rs rust/neuros-runtime/src/lib.rs
          git commit -m "feat(runtime): execute qualified exact alignment plans"
          git push origin HEAD:feat/rust-aligned-execution-v1
