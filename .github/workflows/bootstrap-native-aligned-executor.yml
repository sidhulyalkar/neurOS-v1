name: Bootstrap native aligned executor

on:
  push:
    branches:
      - feat/rust-aligned-execution-v1

permissions:
  contents: write

jobs:
  integrate-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Integrate native aligned executor
        run: python tools/bootstrap_aligned_executor.py
      - name: Qualify native executor
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p neuros-runtime --all-features
      - name: Publish native executor tranche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "neurOS integration bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bootstrap-native-aligned-executor.yml tools/bootstrap_aligned_executor.py
          git add rust/neuros-runtime/src/aligned.rs rust/neuros-runtime/src/dataset.rs rust/neuros-runtime/src/lib.rs
          git commit -m "feat(runtime): execute qualified exact alignment plans"
          git push origin HEAD:feat/rust-aligned-execution-v1
