name: NSQ Kumar2024 GPU cloud contracts

on:
  pull_request:
    paths:
      - "packages/neuros/src/neuros/evidence/kumar2024_gpu_cloud.py"
      - "scripts/evidence/kaggle_kumar2024_gpu_runner.py"
      - "tests/test_kumar2024_gpu_cloud.py"
      - ".github/workflows/nsq-kumar2024-gpu-cloud-ci.yml"
      - ".github/workflows/nsq-kumar2024-kaggle-preflight.yml"
      - ".github/workflows/nsq-kumar2024-owner-preflight-bridge.yml"
      - "docs/NSQ_KUMAR2024_KAGGLE_GPU.md"
  push:
    branches: [main]
    paths:
      - "packages/neuros/src/neuros/evidence/kumar2024_gpu_cloud.py"
      - "scripts/evidence/kaggle_kumar2024_gpu_runner.py"
      - "tests/test_kumar2024_gpu_cloud.py"
      - ".github/workflows/nsq-kumar2024-gpu-cloud-ci.yml"
      - ".github/workflows/nsq-kumar2024-kaggle-preflight.yml"
      - ".github/workflows/nsq-kumar2024-owner-preflight-bridge.yml"
      - "docs/NSQ_KUMAR2024_KAGGLE_GPU.md"

permissions:
  contents: read

jobs:
  gpu-cloud-contracts:
    name: GPU cloud authority contracts / Python 3.11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install authority stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-drivers
          python -m pip install -e packages/neuros-models
          python -m pip install -e packages/neuros-foundation
          python -m pip install -e packages/orion
          python -m pip install -e packages/neuros pytest pytest-asyncio
      - name: Run GPU cloud authority tests
        run: pytest -q tests/test_kumar2024_gpu_cloud.py
      - name: Compile cloud execution surfaces
        run: |
          python -m compileall -q \
            packages/neuros/src/neuros/evidence/kumar2024_gpu_cloud.py \
            scripts/evidence/kaggle_kumar2024_gpu_runner.py
      - name: Assert cloud runner never reads scientific score artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("scripts/evidence/kaggle_kumar2024_gpu_runner.py").read_text()
          for forbidden in ("case_result.json", "shard_result.json", "balanced_accuracy"):
              assert forbidden not in text, forbidden
          PY
      - name: Assert free-quota gate is isolated from scientific binding
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/nsq-kumar2024-kaggle-preflight.yml").read_text()
          assert "  quota-gate:" in text
          assert "  kaggle-t4-preflight:" in text
          quota = text.split("  quota-gate:", 1)[1].split("  kaggle-t4-preflight:", 1)[0]
          preflight = text.split("  kaggle-t4-preflight:", 1)[1]
          binding_prefix = preflight.split(
              "      - name: Build CUDA-bound no-model authority", 1
          )[0]

          assert "kaggle quota --csv" in quota
          assert '"kaggle==${KAGGLE_CLI_VERSION}"' in quota
          assert "MIN_FREE_GPU_HOURS" in text
          assert "scientific_result_used" in quota
          assert "neuros.evidence.kumar2024_gpu_cloud bind" not in quota
          assert "needs: quota-gate" in preflight
          assert "kaggle quota" not in binding_prefix
          assert '"kaggle==${KAGGLE_CLI_VERSION}"' not in binding_prefix
          assert "KAGGLE_GPU_QUOTA_SHA256" in preflight
          assert "KAGGLE_GPU_REMAINING_HOURS" in preflight
          assert "kaggle_gpu_quota_snapshot_sha256" in preflight
          assert "kaggle_gpu_remaining_hours_at_gate" in preflight
          PY
      - name: Assert owner-only command bridge cannot choose scientific inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path(
              ".github/workflows/nsq-kumar2024-owner-preflight-bridge.yml"
          ).read_text()
          target = Path(
              ".github/workflows/nsq-kumar2024-kaggle-preflight.yml"
          ).read_text()

          assert "issue_comment:" in bridge
          assert "types: [created]" in bridge
          assert "actions: write" in bridge
          assert "contents: read" in bridge
          assert "github.event.issue.number == 167" in bridge
          assert "github.event.issue.pull_request != null" in bridge
          assert "github.actor == github.repository_owner" in bridge
          assert "github.event.comment.user.login == github.repository_owner" in bridge
          assert "github.event.comment.author_association == 'OWNER'" in bridge
          assert "github.event.comment.body == '/nsq-kumar2024-t4-preflight'" in bridge
          assert "nsq-kumar2024-kaggle-preflight.yml" in bridge
          assert "event=workflow_dispatch" in bridge
          assert 'printf \'%s\\n\' \'{"ref":"main"}\'' in bridge
          assert "workflow_run_id" in bridge
          assert 'observed["head_sha"] != expected_sha' in bridge
          assert "/cancel" in bridge
          assert "status != \"completed\"" in bridge
          assert 'conclusion == "success"' in bridge
          assert "cancel-in-progress: false" in bridge

          for secret_name in ("KAGGLE_USERNAME", "KAGGLE_KEY"):
              assert secret_name not in bridge, secret_name
          for scientific_choice in (
              "target_session",
              "split_seed",
              "method_id",
              "model_seed",
              "budgets_per_class",
              "balanced_accuracy",
              "scientific_score",
          ):
              assert scientific_choice not in bridge, scientific_choice

          assert "workflow_dispatch:" in target
          assert "subject: `1`" not in bridge
          PY
