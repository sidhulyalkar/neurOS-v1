name: Public Trust Contracts

on:
  pull_request:
    paths:
      - "CITATION.cff"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "GOVERNANCE.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "mkdocs.yml"
      - "packages/neuros/src/neuros/evidence/**"
      - "tests/test_scientific_claim_spec.py"
      - "scripts/check_public_contracts.py"
      - "scripts/check_github_action_pins.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "CITATION.cff"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "GOVERNANCE.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "mkdocs.yml"
      - "packages/neuros/src/neuros/evidence/**"
      - "tests/test_scientific_claim_spec.py"
      - "scripts/check_public_contracts.py"
      - "scripts/check_github_action_pins.py"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: public-trust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-contracts:
    name: Citation, claims, governance, and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require literal clean qualification source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${EXPECTED}"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Enforce immutable GitHub Actions references
        run: python scripts/check_github_action_pins.py
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml cffconvert pytest
      - name: Validate scientific claim contracts
        env:
          PYTHONPATH: packages/neuros/src
        run: pytest -q tests/test_scientific_claim_spec.py
      - name: Validate repository public contracts
        run: python scripts/check_public_contracts.py
      - name: Validate citation metadata against CFF schema
        run: cffconvert --validate

  docs-strict:
    name: Strict documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material
      - name: Build public documentation with warnings as failures
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/neuros-docs"
