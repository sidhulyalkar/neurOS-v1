name: Staging Representation Temporal Ablation

on:
  push:
    branches:
      - staging/representation-temporal-ablation-v1
    paths:
      - ".github/workflows/staging-representation-temporal-ablation.yml"
      - "packages/neuros-mechint/src/neuros_mechint/representations/**"
      - "packages/neuros-mechint/tests/test_mechint_temporal_ablation*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-ablation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require exact clean staging source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/neuros-core/pyproject.toml
            packages/neuros-mechint/pyproject.toml
      - name: Install dependency-light representation surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip install -e packages/neuros-mechint
          python -m pip check
      - name: Prove optional manifold packages were not pulled in
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("tphate") is None
          assert importlib.util.find_spec("phate") is None
          PY
      - name: Compile temporal ablation surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            packages/neuros-mechint/src/neuros_mechint/representations/temporal_ablation.py \
            packages/neuros-mechint/src/neuros_mechint/representations/corruptions.py \
            packages/neuros-mechint/tests/test_mechint_temporal_ablation.py \
            packages/neuros-mechint/tests/test_mechint_temporal_ablation_provenance.py
      - name: Exercise temporal ablation adversaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            packages/neuros-mechint/tests/test_mechint_temporal_ablation.py \
            packages/neuros-mechint/tests/test_mechint_temporal_ablation_provenance.py \
            packages/neuros-mechint/tests/test_mechint_representation_cases.py \
            packages/neuros-mechint/tests/test_mechint_representation_sweep.py
