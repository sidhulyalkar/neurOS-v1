name: Rust Runtime CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "packages/neuros/pyproject.toml"
      - ".github/workflows/rust-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "packages/neuros/pyproject.toml"
      - ".github/workflows/rust-runtime-ci.yml"

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p neuros-runtime --all-features

  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build native wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0"
          maturin build --release --manifest-path rust/neuros-runtime-py/Cargo.toml --interpreter python
      - name: Install native wheel
        run: python -m pip install target/wheels/*.whl
      - name: Native Arrow and exact-clock smoke test
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import struct
          import sys
          import tempfile
          from pathlib import Path

          import neuros_runtime_native as native

          def write_f32(path, count):
              path.write_bytes(
                  b"".join(struct.pack("<f", float(value)) for value in range(count))
              )

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              write_f32(root / "fmri.f32", 40)
              write_f32(root / "behavior.f32", 40)
              manifest = {
                  "schema_version": 1,
                  "dataset_id": "ci-smoke",
                  "records": [
                      {
                          "id": "fmri-run-01",
                          "subject": "sub-01",
                          "modality": "fmri",
                          "sync_group": "sub-01/run-01",
                          "path": "fmri.f32",
                          "dtype": "float32-le",
                          "shape": [10, 4],
                          "sampling_hz": 0.5,
                          "clock": {
                              "id": "scanner-clock",
                              "start_ns": 0,
                              "period_ns": 2_000_000_000,
                          },
                      },
                      {
                          "id": "behavior-run-01",
                          "subject": "sub-01",
                          "modality": "behavior",
                          "sync_group": "sub-01/run-01",
                          "path": "behavior.f32",
                          "dtype": "float32-le",
                          "shape": [40, 1],
                          "sampling_hz": 2.0,
                          "clock": {
                              "id": "behavior-clock",
                              "start_ns": 0,
                              "period_ns": 500_000_000,
                          },
                      },
                  ],
              }
              (root / "neuros.dataset.json").write_text(json.dumps(manifest))
              dataset = native.NativeDataset.open(root)

              # Preserve the promoted v0 zero-copy single-modality path.
              stream = dataset.stream(modalities=["fmri"], window=2, stride=2, prefetch=2)
              first = next(stream)
              arrow = first.to_arrow()
              assert first.shape == [2, 4]
              assert len(arrow) == 8
              assert first.modality == "fmri"
              assert len(first.manifest_sha256) == 64

              # Qualify v1 native planning without opening multimodal source windows.
              plan = dataset.plan_aligned(
                  sync_group="sub-01/run-01",
                  modalities=["fmri", "behavior"],
                  duration_ns=4_000_000_000,
                  stride_ns=2_000_000_000,
              )
              payload = json.loads(plan.to_json())
              assert payload["policy"] == "exact"
              assert payload["start_ns"] == 0
              assert payload["overlap_end_ns"] == 20_000_000_000
              assert payload["window_count"] == 9
              assert len(plan.sha256) == 64
              assert [entry["modality"] for entry in payload["entries"]] == [
                  "behavior",
                  "fmri",
              ]

              clocks = {
                  record["modality"]: record["clock"] for record in manifest["records"]
              }
              for entry in payload["entries"]:
                  clock = clocks[entry["modality"]]
                  expected_start_frame = (
                      payload["start_ns"] - clock["start_ns"]
                  ) // clock["period_ns"]
                  expected_frames = payload["duration_ns"] // clock["period_ns"]
                  expected_stride = payload["stride_ns"] // clock["period_ns"]
                  assert entry["start_frame"] == expected_start_frame
                  assert entry["frames_per_window"] == expected_frames
                  assert entry["frame_stride"] == expected_stride

              # Exercise the dependency-light public Python facade against the same wheel.
              module_path = Path("packages/neuros/src/neuros/dataset.py").resolve()
              spec = importlib.util.spec_from_file_location(
                  "neuros_runtime_dataset_smoke", module_path
              )
              assert spec is not None and spec.loader is not None
              dataset_module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = dataset_module
              spec.loader.exec_module(dataset_module)

              study = dataset_module.Dataset.open(root)
              public_plan = study.plan_aligned(
                  sync_group="sub-01/run-01",
                  modalities=["fmri", "behavior"],
                  duration_ns=4_000_000_000,
                  stride_ns=2_000_000_000,
              )
              assert public_plan.sha256 == plan.sha256
              assert public_plan.window_count == 9
              window = public_plan.window(3)
              assert window["start_ns"] == 6_000_000_000
              assert window["end_ns"] == 10_000_000_000
              by_modality = {item["modality"]: item for item in window["slices"]}
              assert by_modality["fmri"]["start_frame"] == 3
              assert by_modality["fmri"]["stop_frame"] == 5
              assert by_modality["behavior"]["start_frame"] == 12
              assert by_modality["behavior"]["stop_frame"] == 20
          PY
