name: Rust Runtime CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "packages/neuros/pyproject.toml"
      - "tests/test_runtime_content_provenance.py"
      - ".github/workflows/rust-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "packages/neuros/pyproject.toml"
      - "tests/test_runtime_content_provenance.py"
      - ".github/workflows/rust-runtime-ci.yml"

permissions:
  contents: read

env:
  RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: rust-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RUNTIME_SOURCE_SHA }}
          persist-credentials: false
      - name: Require exact clean runtime source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RUNTIME_SOURCE_SHA}"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p neuros-runtime --all-features

  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RUNTIME_SOURCE_SHA }}
          persist-credentials: false
      - name: Require exact clean runtime source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RUNTIME_SOURCE_SHA}"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build native wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0"
          maturin build --release --manifest-path rust/neuros-runtime-py/Cargo.toml --interpreter python
      - name: Install native wheel
        run: python -m pip install target/wheels/*.whl
      - name: Native Arrow, provenance, and exact-clock smoke test
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import struct
          import sys
          import tempfile
          from pathlib import Path

          import neuros_runtime_native as native

          def write_f32(path: Path, count: int) -> str:
              source = b"".join(
                  struct.pack("<f", float(value)) for value in range(count)
              )
              path.write_bytes(source)
              return hashlib.sha256(source).hexdigest()

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              fmri_sha256 = write_f32(root / "fmri.f32", 40)
              behavior_sha256 = write_f32(root / "behavior.f32", 40)
              manifest = {
                  "schema_version": 1,
                  "dataset_id": "ci-smoke",
                  "records": [
                      {
                          "id": "fmri-run-01",
                          "subject": "sub-01",
                          "modality": "fmri",
                          "sync_group": "sub-01/run-01",
                          "path": "fmri.f32",
                          "source_sha256": fmri_sha256,
                          "dtype": "float32-le",
                          "shape": [10, 4],
                          "sampling_hz": 0.5,
                          "clock": {
                              "id": "scanner-clock",
                              "start_ns": 0,
                              "period_ns": 2_000_000_000,
                          },
                      },
                      {
                          "id": "behavior-run-01",
                          "subject": "sub-01",
                          "modality": "behavior",
                          "sync_group": "sub-01/run-01",
                          "path": "behavior.f32",
                          "source_sha256": behavior_sha256,
                          "dtype": "float32-le",
                          "shape": [40, 1],
                          "sampling_hz": 2.0,
                          "clock": {
                              "id": "behavior-clock",
                              "start_ns": 0,
                              "period_ns": 500_000_000,
                          },
                      },
                  ],
              }
              (root / "neuros.dataset.json").write_text(json.dumps(manifest))
              dataset = native.NativeDataset.open(root)
              declared_dataset_sha256 = dataset.declared_dataset_content_sha256
              assert declared_dataset_sha256 is not None
              assert dataset.verified_dataset_content_sha256 is None

              # Planning is provenance-bound: it verifies every declared source
              # before returning metadata, while opening no scientific window.
              plan = dataset.plan_aligned(
                  sync_group="sub-01/run-01",
                  modalities=["fmri", "behavior"],
                  duration_ns=4_000_000_000,
                  stride_ns=2_000_000_000,
              )
              assert dataset.verified_dataset_content_sha256 == declared_dataset_sha256
              assert plan.dataset_content_sha256 == declared_dataset_sha256
              payload = json.loads(plan.to_json())
              assert payload["policy"] == "exact"
              assert payload["dataset_content_sha256"] == declared_dataset_sha256
              assert payload["manifest_sha256"] == dataset.manifest_sha256
              assert payload["start_ns"] == 0
              assert payload["overlap_end_ns"] == 20_000_000_000
              assert payload["window_count"] == 9
              assert len(plan.sha256) == 64
              assert [entry["modality"] for entry in payload["entries"]] == [
                  "behavior",
                  "fmri",
              ]
              expected_source_hashes = {
                  "fmri": fmri_sha256,
                  "behavior": behavior_sha256,
              }
              clocks = {
                  record["modality"]: record["clock"] for record in manifest["records"]
              }
              shapes = {
                  record["modality"]: record["shape"] for record in manifest["records"]
              }
              for entry in payload["entries"]:
                  modality = entry["modality"]
                  clock = clocks[modality]
                  expected_start_frame = (
                      payload["start_ns"] - clock["start_ns"]
                  ) // clock["period_ns"]
                  expected_frames = payload["duration_ns"] // clock["period_ns"]
                  expected_stride = payload["stride_ns"] // clock["period_ns"]
                  assert entry["source_sha256"] == expected_source_hashes[modality]
                  assert entry["offset_bytes"] == 0
                  assert entry["dtype"] == "float32-le"
                  assert entry["shape"] == shapes[modality]
                  assert entry["clock_id"] == clock["id"]
                  assert entry["clock_start_ns"] == clock["start_ns"]
                  assert entry["period_ns"] == clock["period_ns"]
                  assert entry["start_frame"] == expected_start_frame
                  assert entry["frames_per_window"] == expected_frames
                  assert entry["frame_stride"] == expected_stride

              # Preserve the promoted v0 zero-copy + provenance path after planning.
              stream = dataset.stream(
                  modalities=["fmri"], window=2, stride=2, prefetch=2
              )
              first = next(stream)
              arrow = first.to_arrow()
              assert first.shape == [2, 4]
              assert len(arrow) == 8
              assert first.modality == "fmri"
              assert first.start_frame == 0
              assert first.end_frame_exclusive == 2
              assert first.record_byte_start == 0
              assert first.record_byte_end_exclusive == 160
              assert len(first.manifest_sha256) == 64
              assert first.source_size_bytes == 160
              assert first.declared_source_sha256 == fmri_sha256
              assert first.verified_source_sha256 == fmri_sha256
              assert first.source_verification_state == "verified_at_open"
              assert first.declared_dataset_content_sha256 == declared_dataset_sha256
              assert first.verified_dataset_content_sha256 == declared_dataset_sha256

              # Exercise the dependency-light public Python facade against the same wheel.
              module_path = Path("packages/neuros/src/neuros/dataset.py").resolve()
              spec = importlib.util.spec_from_file_location(
                  "neuros_runtime_dataset_smoke", module_path
              )
              assert spec is not None and spec.loader is not None
              dataset_module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = dataset_module
              spec.loader.exec_module(dataset_module)

              study = dataset_module.Dataset.open(root)
              public_plan = study.plan_aligned(
                  sync_group="sub-01/run-01",
                  modalities=["fmri", "behavior"],
                  duration_ns=4_000_000_000,
                  stride_ns=2_000_000_000,
              )
              assert public_plan.sha256 == plan.sha256
              assert public_plan.dataset_content_sha256 == declared_dataset_sha256
              assert public_plan.manifest_sha256 == dataset.manifest_sha256
              assert public_plan.window_count == 9
              window = public_plan.window(3)
              assert window["plan_sha256"] == public_plan.sha256
              assert window["dataset_content_sha256"] == declared_dataset_sha256
              assert window["start_ns"] == 6_000_000_000
              assert window["end_ns"] == 10_000_000_000
              by_modality = {item["modality"]: item for item in window["slices"]}
              assert by_modality["fmri"]["source_sha256"] == fmri_sha256
              assert by_modality["fmri"]["start_frame"] == 3
              assert by_modality["fmri"]["stop_frame"] == 5
              assert by_modality["behavior"]["source_sha256"] == behavior_sha256
              assert by_modality["behavior"]["start_frame"] == 12
              assert by_modality["behavior"]["stop_frame"] == 20
          PY
      - name: Measure provenance verification and warm iteration
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import resource
          import tempfile
          import time
          from pathlib import Path

          import neuros_runtime_native as native

          source_bytes = 32 * 1024 * 1024
          chunk = bytes(range(256)) * 4096
          repeats = source_bytes // len(chunk)
          hasher = hashlib.sha256()

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              source_path = root / "benchmark.f32"
              with source_path.open("wb") as stream:
                  for _ in range(repeats):
                      stream.write(chunk)
                      hasher.update(chunk)
              assert source_path.stat().st_size == source_bytes
              source_sha256 = hasher.hexdigest()
              manifest = {
                  "schema_version": 1,
                  "dataset_id": "provenance-benchmark",
                  "records": [
                      {
                          "id": "r1",
                          "subject": "sub-01",
                          "modality": "fmri",
                          "path": "benchmark.f32",
                          "source_sha256": source_sha256,
                          "dtype": "float32-le",
                          "shape": [source_bytes // 4],
                          "sampling_hz": 1.0,
                      }
                  ],
              }
              (root / "neuros.dataset.json").write_text(json.dumps(manifest))
              dataset = native.NativeDataset.open(root)
              declared = dataset.declared_dataset_content_sha256
              assert declared is not None

              rss_before_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
              started = time.perf_counter()
              verified = dataset.verify_content()
              verify_seconds = time.perf_counter() - started
              rss_after_verify_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
              assert verified == declared
              assert verify_seconds > 0.0

              window = 4096
              stream = dataset.stream(
                  modalities=["fmri"], window=window, stride=window, prefetch=8
              )
              first = next(stream)
              assert first.verified_source_sha256 == source_sha256
              expected_windows = (source_bytes // 4) // window
              started = time.perf_counter()
              remaining = sum(1 for _ in stream)
              warm_iteration_seconds = time.perf_counter() - started
              assert remaining + 1 == expected_windows
              assert warm_iteration_seconds > 0.0
              rss_after_iteration_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss

              mib = source_bytes / (1024 * 1024)
              evidence = {
                  "kind": "neuros_runtime_provenance_performance_evidence",
                  "schema_version": 1,
                  "source_revision": os.environ["RUNTIME_SOURCE_SHA"],
                  "scientific_boundary": (
                      "Measurement-only systems evidence. Runner timing is not a scientific "
                      "promotion threshold and must not be compared as model performance."
                  ),
                  "source_bytes": source_bytes,
                  "source_mib": mib,
                  "declared_dataset_content_sha256": declared,
                  "verified_dataset_content_sha256": verified,
                  "cold_verify_seconds": verify_seconds,
                  "cold_verify_mib_per_second": mib / verify_seconds,
                  "warm_window_count_after_first": remaining,
                  "warm_iteration_seconds": warm_iteration_seconds,
                  "warm_windows_per_second": remaining / warm_iteration_seconds,
                  "rss_before_kb": rss_before_kb,
                  "rss_after_verify_kb": rss_after_verify_kb,
                  "rss_after_iteration_kb": rss_after_iteration_kb,
                  "maxrss_growth_kb": max(0, rss_after_iteration_kb - rss_before_kb),
              }
              Path("artifacts/runtime-provenance-benchmark.json").write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n"
              )
              print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Upload provenance performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-provenance-performance-${{ env.RUNTIME_SOURCE_SHA }}
          path: artifacts/runtime-provenance-benchmark.json
          if-no-files-found: error
          retention-days: 90
