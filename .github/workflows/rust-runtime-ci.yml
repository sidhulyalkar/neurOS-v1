name: Rust Runtime CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "packages/neuros/pyproject.toml"
      - ".github/workflows/rust-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "packages/neuros/pyproject.toml"
      - ".github/workflows/rust-runtime-ci.yml"

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p neuros-runtime --all-features

  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
      - name: Build native wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0"
          maturin build --release --manifest-path rust/neuros-runtime-py/Cargo.toml --interpreter python
      - name: Install native wheel
        run: python -m pip install target/wheels/*.whl
      - name: Native Arrow and exact-clock smoke test
        run: |
          python - <<'PY'
          import json
          import struct
          import tempfile
          from pathlib import Path

          import neuros_runtime_native as native

          def write_f32(path, count):
              path.write_bytes(
                  b"".join(struct.pack("<f", float(value)) for value in range(count))
              )

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              write_f32(root / "fmri.f32", 40)
              write_f32(root / "behavior.f32", 40)
              manifest = {
                  "schema_version": 1,
                  "dataset_id": "ci-smoke",
                  "records": [
                      {
                          "id": "fmri-run-01",
                          "subject": "sub-01",
                          "modality": "fmri",
                          "sync_group": "sub-01/run-01",
                          "path": "fmri.f32",
                          "dtype": "float32-le",
                          "shape": [10, 4],
                          "sampling_hz": 0.5,
                          "clock": {
                              "id": "scanner-clock",
                              "start_ns": 0,
                              "period_ns": 2_000_000_000,
                          },
                      },
                      {
                          "id": "behavior-run-01",
                          "subject": "sub-01",
                          "modality": "behavior",
                          "sync_group": "sub-01/run-01",
                          "path": "behavior.f32",
                          "dtype": "float32-le",
                          "shape": [40, 1],
                          "sampling_hz": 2.0,
                          "clock": {
                              "id": "behavior-clock",
                              "start_ns": 0,
                              "period_ns": 500_000_000,
                          },
                      },
                  ],
              }
              (root / "neuros.dataset.json").write_text(json.dumps(manifest))
              dataset = native.NativeDataset.open(root)

              # Preserve the promoted v0 zero-copy single-modality path.
              stream = dataset.stream(modalities=["fmri"], window=2, stride=2, prefetch=2)
              first = next(stream)
              arrow = first.to_arrow()
              assert first.shape == [2, 4]
              assert len(arrow) == 8
              assert first.modality == "fmri"
              assert len(first.manifest_sha256) == 64

              # Qualify v1 planning without opening multimodal source windows.
              plan = dataset.plan_aligned(
                  sync_group="sub-01/run-01",
                  modalities=["fmri", "behavior"],
                  duration_ns=4_000_000_000,
                  stride_ns=2_000_000_000,
              )
              payload = json.loads(plan.to_json())
              assert payload["policy"] == "exact"
              assert payload["start_ns"] == 0
              assert payload["overlap_end_ns"] == 20_000_000_000
              assert payload["window_count"] == 9
              assert len(plan.sha256) == 64
              assert [entry["modality"] for entry in payload["entries"]] == [
                  "behavior",
                  "fmri",
              ]

              clocks = {
                  record["modality"]: record["clock"] for record in manifest["records"]
              }
              for entry in payload["entries"]:
                  clock = clocks[entry["modality"]]
                  expected_start_frame = (
                      payload["start_ns"] - clock["start_ns"]
                  ) // clock["period_ns"]
                  expected_frames = payload["duration_ns"] // clock["period_ns"]
                  expected_stride = payload["stride_ns"] // clock["period_ns"]
                  assert entry["start_frame"] == expected_start_frame
                  assert entry["frames_per_window"] == expected_frames
                  assert entry["frame_stride"] == expected_stride
          PY
