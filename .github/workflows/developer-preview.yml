name: Developer Preview Journey

on:
  pull_request:
    paths:
      - ".github/workflows/developer-preview.yml"
      - "scripts/run_developer_preview_journey.py"
      - "scripts/evidence/verify_public_qualification_bundle.py"
      - "tests/test_independent_qualification_verifier.py"
      - "docs/getting-started/**"
      - "mkdocs.yml"
      - "configs/examples/mock_bci.yaml"
      - "examples/plugins/**"
      - "packages/neuros-core/**"
      - "packages/neuros-drivers/**"
      - "packages/neuros-models/**"
      - "packages/neuros/**"
      - "packages/neuros-arena/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/developer-preview.yml"
      - "scripts/run_developer_preview_journey.py"
      - "scripts/evidence/verify_public_qualification_bundle.py"
      - "tests/test_independent_qualification_verifier.py"
      - "docs/getting-started/**"
      - "mkdocs.yml"
      - "configs/examples/mock_bci.yaml"
      - "examples/plugins/**"
      - "packages/neuros-core/**"
      - "packages/neuros-drivers/**"
      - "packages/neuros-models/**"
      - "packages/neuros/**"
      - "packages/neuros-arena/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-preview-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel-journey:
    name: Installed-wheel external-user journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Root-pin regression tests (stdlib only)
        run: python -m unittest discover -s tests -p "test_developer_preview_root_pin.py" -v
      - name: Independent qualification-verifier adversarial tests
        run: python -m unittest discover -s tests -p "test_independent_qualification_verifier.py" -v
      - name: Build exact public-path wheels
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          DIST="${RUNNER_TEMP}/developer-preview-wheels"
          mkdir -p "${DIST}"
          python -m build --wheel --outdir "${DIST}" packages/neuros-core
          python -m build --wheel --outdir "${DIST}" packages/neuros-drivers
          python -m build --wheel --outdir "${DIST}" packages/neuros-models
          python -m build --wheel --outdir "${DIST}" packages/neuros
          python -m build --wheel --outdir "${DIST}" packages/neuros-arena
          python -m build --wheel --outdir "${DIST}" examples/plugins/neuros-example-plugin
          test "$(find "${DIST}" -maxdepth 1 -name '*.whl' | wc -l)" -eq 6
      - name: Install only built neurOS/plugin artifacts
        run: |
          set -euo pipefail
          DIST="${RUNNER_TEMP}/developer-preview-wheels"
          ENV="${RUNNER_TEMP}/developer-preview-env"
          python -m venv "${ENV}"
          PY="${ENV}/bin/python"
          PIP="${ENV}/bin/pip"
          "${PY}" -m pip install --upgrade pip
          CORE="$(find "${DIST}" -name 'neuros_core-*.whl' -print -quit)"
          DRIVERS="$(find "${DIST}" -name 'neuros_drivers-*.whl' -print -quit)"
          MODELS="$(find "${DIST}" -name 'neuros_models-*.whl' -print -quit)"
          SDK="$(find "${DIST}" -name 'neuros-[0-9]*.whl' -print -quit)"
          ARENA="$(find "${DIST}" -name 'neuros_arena-*.whl' -print -quit)"
          PLUGIN="$(find "${DIST}" -name 'neuros_example_plugin-*.whl' -print -quit)"
          for artifact in "${CORE}" "${DRIVERS}" "${MODELS}" "${SDK}" "${ARENA}" "${PLUGIN}"; do
            test -n "${artifact}"
          done
          "${PIP}" install "${CORE}" "${DRIVERS}" "${MODELS}" "${SDK}" "${ARENA}" "${PLUGIN}"
          "${PIP}" check
      - name: Qualify generated starter project from installed wheel
        run: |
          set -euo pipefail
          CLI="${RUNNER_TEMP}/developer-preview-env/bin/neuros"
          STARTER="${RUNNER_TEMP}/neuros-starter"
          "${CLI}" init "${STARTER}" --json > "${RUNNER_TEMP}/starter-init.json"
          test -s "${STARTER}/neuros.yaml"
          test -s "${STARTER}/README.md"
          "${CLI}" validate "${STARTER}/neuros.yaml" --json > "${RUNNER_TEMP}/starter-validate.json"
          "${CLI}" run "${STARTER}/neuros.yaml" --duration 0.1 --json > "${RUNNER_TEMP}/starter-run.json"
          "${CLI}" qualify "${STARTER}/neuros.yaml" \
            --output "${STARTER}/evidence/qualification" \
            --duration 0.1 \
            --json > "${RUNNER_TEMP}/starter-qualify.json"
          ROOT="$(python -c 'import json, os, pathlib, re; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"starter-qualify.json"; v=json.loads(p.read_text(encoding="utf-8")).get("bundle_sha256"); assert isinstance(v,str) and re.fullmatch(r"[0-9a-f]{64}",v), "invalid root"; print(v)')"
          "${CLI}" reproduce "${STARTER}/evidence/qualification" \
            --expected-sha256 "${ROOT}" \
            --json > "${RUNNER_TEMP}/starter-reproduce.json"
          ROOT="${ROOT}" python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"starter-reproduce.json"; v=json.loads(p.read_text(encoding="utf-8")); assert v.get("reproduced") is True and v.get("bundle_sha256")==os.environ["ROOT"] and v.get("origin_authenticity")=="externally_pinned", "root-pin failure"'
      - name: Run the complete installed-wheel journey
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/developer-preview-env/bin/python"
          OUT="${RUNNER_TEMP}/developer-preview-report"
          "${PY}" scripts/run_developer_preview_journey.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --output "${OUT}" \
            --duration 0.1
          test -s "${OUT}/journey-report.json"
          "${PY}" - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "developer-preview-report" / "journey-report.json"
          payload = json.loads(report.read_text(encoding="utf-8"))
          assert payload["schema"] == "neuros.developer_preview_journey.v1"
          assert payload["status"] == "pass", payload.get("failure")
          assert len(payload["commands"]) >= 15
          assert all(not item["editable"] for item in payload["distributions"].values())
          required = {"session", "qualification", "arena_report"}
          assert required <= set(payload["artifacts"])
          root = payload["artifacts"]["qualification_root_sha256"]
          assert len(root) == 64
          reproduction = payload["artifacts"]["reproduction_result"]
          assert reproduction["reproduced"] is True
          assert reproduction["bundle_sha256"] == root
          assert reproduction["origin_authenticity"] == "externally_pinned"
          PY
      - name: Independently verify installed-wheel qualification bundle
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/developer-preview-report"
          ROOT="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "developer-preview-report" / "journey-report.json"
          report = json.loads(p.read_text(encoding="utf-8"))
          print(report["artifacts"]["qualification_result"]["bundle_sha256"])
          PY
          )"
          python scripts/evidence/verify_public_qualification_bundle.py "${OUT}/qualification" \
            --expected-sha256 "${ROOT}" > "${OUT}/independent-verification.json"
          ROOT="${ROOT}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "developer-preview-report" / "independent-verification.json"
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "verified"
          assert report["root_sha256"] == os.environ["ROOT"]
          assert report["frame_count"] > 0
          assert report["decoder_reexecuted"] is False
          assert report["scientific_result_interpretable"] is False
          PY
      - name: Upload developer-preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neurOS-developer-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/developer-preview-report
            ${{ runner.temp }}/starter-*.json
          if-no-files-found: warn
          retention-days: 30
