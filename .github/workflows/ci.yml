name: neurOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce active/product/research/archive boundaries
        run: python scripts/check_repo_hygiene.py

  kernel-contracts:
    name: Kernel contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install kernel test profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
      - name: Run kernel contract tests
        run: |
          pytest -q \
            tests/test_kernel_contracts.py \
            tests/test_runtime_queues.py \
            tests/test_runtime_executor.py \
            tests/test_plugin_registry.py \
            tests/test_config_schema.py \
            tests/test_clock_sync.py \
            tests/test_replay.py \
            tests/test_session_archive.py \
            tests/test_quality_v3.py

  bci-smoke:
    name: BCI end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install BCI workspace profile
        run: |
          python -m pip install --upgrade pip
          python scripts/bootstrap.py --profile bci --test-tools
      - name: Exercise installed CLI and persistent replay
        run: |
          neuros doctor --json
          neuros validate configs/examples/mock_bci.yaml --json
          neuros run configs/examples/mock_bci.yaml --duration 0.05 --json
          SESSION_DIR="${RUNNER_TEMP}/neuros-session"
          neuros record configs/examples/mock_bci.yaml --output "${SESSION_DIR}" --session-id ci --duration 0.05 --json
          neuros inspect "${SESSION_DIR}" --verify --json
          neuros replay "${SESSION_DIR}" --config configs/examples/mock_bci.yaml --json
      - name: Run pipeline, config, plugin, CLI, and recording smoke tests
        run: |
          pytest -q \
            tests/test_pipeline.py \
            tests/test_builtin_plugins.py \
            tests/test_config_resolution.py \
            tests/test_runtime_executor.py \
            tests/test_cli_v3.py \
            tests/test_recording_cli.py \
            tests/test_session_archive.py \
            tests/test_kernel_contracts.py \
            tests/test_runtime_queues.py \
            tests/test_plugin_registry.py \
            tests/test_config_schema.py \
            tests/test_clock_sync.py \
            tests/test_replay.py

  scientific-quality:
    name: Scientific and latency gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install BCI quality profile
        run: |
          python -m pip install --upgrade pip
          python scripts/bootstrap.py --profile bci --test-tools
      - name: Run deterministic quality tests
        run: pytest -q tests/test_quality_v3.py tests/test_feature_extraction_compat.py
      - name: Run version-controlled quality gate
        run: |
          python scripts/run_quality_gate.py configs/examples/mock_bci.yaml \
            --thresholds configs/quality/ci.yaml \
            --report "${RUNNER_TEMP}/quality-report.json"

  recording-interop:
    name: Recording interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install recording exporters
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[recording,test]"
      - name: Verify NWB and Zarr exports
        run: pytest -q tests/test_recording_exports.py tests/test_session_archive.py

  models-mechint:
    name: Model / mech-int contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model and mech-int contract profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip install -e "packages/neuros-models[dev]"
          python -m pip install -e packages/neuros-mechint
      - name: Run model / mech-int regression suite
        run: pytest -q packages/neuros-models/tests/test_models_v21.py
      - name: Exercise model discovery and analysis manifest
        run: |
          neuros-models list --mechint-ready
          python packages/neuros-models/examples/01_inspect_eeg_conformer.py

  foundation-models:
    name: Foundation interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install local foundation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e "packages/neuros-foundation[dev]"
      - name: Run foundation interoperability regressions
        run: |
          pytest -q \
            packages/neuros-foundation/tests/test_registry_v2.py \
            tests/test_foundation_registry_v2.py
      - name: Exercise dependency-light foundation examples
        run: |
          python packages/neuros-foundation/examples/01_discover_landscape.py
          python packages/neuros-foundation/examples/02_probe_embeddings.py
          python packages/neuros-foundation/examples/04_neuros_bridge.py

  sourceweigher:
    name: Source reliability / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install SourceWeigher core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-sourceweigher pytest
      - name: Run SourceWeigher regression suite
        run: pytest -q packages/neuros-sourceweigher/tests
      - name: Exercise dependency-light examples
        run: |
          python packages/neuros-sourceweigher/examples/01_subject_transfer.py
          python packages/neuros-sourceweigher/examples/02_online_drift.py
          python packages/neuros-sourceweigher/examples/03_distribution_methods.py

  orion-contracts:
    name: ORION contracts and tokenization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ORION workspace profile
        run: |
          python -m pip install --upgrade pip
          python scripts/bootstrap.py --profile orion --test-tools
      - name: Run ORION contract and tokenization tests
        run: |
          pytest -q \
            tests/test_orion_contracts.py \
            tests/test_orion_tokenization.py \
            tests/test_kernel_contracts.py
      - name: Run controlled tokenizer benchmark
        run: |
          OUT="${RUNNER_TEMP}/orion-tokenization"
          python scripts/orion/run_tokenizer_benchmark.py \
            configs/orion/tokenization_smoke.yaml \
            --output "${OUT}"
          test -s "${OUT}/metrics.json"
          test -s "${OUT}/comparison_table.csv"
          test -s "${OUT}/tokenizer_cards.md"
