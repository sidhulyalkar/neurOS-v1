name: Runtime Research Authority CI

on:
  pull_request:
    paths:
      - "packages/neuros/src/neuros/authority.py"
      - "packages/neuros-research/src/neuros/research/runtime_bridge.py"
      - "packages/neuros-research/src/neuros/research/__init__.py"
      - "packages/neuros-research/tests/test_runtime_bridge.py"
      - "tests/test_runtime_research_authority.py"
      - ".github/workflows/runtime-research-authority-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/neuros/src/neuros/authority.py"
      - "packages/neuros-research/src/neuros/research/runtime_bridge.py"
      - "packages/neuros-research/src/neuros/research/__init__.py"
      - "packages/neuros-research/tests/test_runtime_bridge.py"
      - "tests/test_runtime_research_authority.py"
      - ".github/workflows/runtime-research-authority-ci.yml"

permissions:
  contents: read

env:
  AUTHORITY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: runtime-research-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-bridge:
    name: Exact runtime/research authority bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUTHORITY_SOURCE_SHA }}
          persist-credentials: false
      - name: Require exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${AUTHORITY_SOURCE_SHA}"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install user-facing and research authority stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python scripts/bootstrap.py --profile bci --test-tools
          python -m pip install -e "packages/neuros-research[dev]"
          python -m pip check
      - name: Compile and lint bridge surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            packages/neuros/src/neuros/authority.py \
            packages/neuros-research/src/neuros/research/runtime_bridge.py
          python -m ruff check \
            packages/neuros/src/neuros/authority.py \
            packages/neuros-research/src/neuros/research/runtime_bridge.py \
            packages/neuros-research/tests/test_runtime_bridge.py \
            tests/test_runtime_research_authority.py
      - name: Run adversarial runtime-to-research authority tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_runtime_research_authority.py \
            packages/neuros-research/tests/test_runtime_bridge.py
