name: neurOS real-world evidence

on:
  pull_request:
    paths:
      - "packages/neuros-foundation/**"
      - "scripts/evidence/**"
      - "docs/REAL_WORLD_EVIDENCE.md"
      - "docs/EVIDENCE_SOURCE_MAP.md"
      - "docs/LONGITUDINAL_EEG_SHOWCASE.md"
      - "docs/LONGITUDINAL_MODEL_LADDER.md"
      - ".github/workflows/evidence-ci.yml"
      - ".github/workflows/longitudinal-evidence-study.yml"
      - ".github/workflows/longitudinal-model-ladder-study.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "packages/neuros-foundation/**"
      - "scripts/evidence/**"
      - "docs/REAL_WORLD_EVIDENCE.md"
      - "docs/EVIDENCE_SOURCE_MAP.md"
      - "docs/LONGITUDINAL_EEG_SHOWCASE.md"
      - "docs/LONGITUDINAL_MODEL_LADDER.md"
      - ".github/workflows/evidence-ci.yml"
      - ".github/workflows/longitudinal-evidence-study.yml"
      - ".github/workflows/longitudinal-model-ladder-study.yml"

permissions:
  contents: read

jobs:
  evidence-contracts:
    name: Evidence contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install local evidence contract stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e "packages/neuros-foundation[dev]"
      - name: Verify grouped and longitudinal evidence contracts
        run: |
          pytest -q \
            packages/neuros-foundation/tests/test_real_world.py \
            packages/neuros-foundation/tests/test_longitudinal.py \
            packages/neuros-foundation/tests/test_longitudinal_authority.py \
            packages/neuros-foundation/tests/test_longitudinal_three_way.py \
            packages/neuros-foundation/tests/test_longitudinal_three_way_authority.py
      - name: Replay three-way authority evidence twice
        run: |
          python scripts/evidence/verify_longitudinal_three_way_authority.py > "${RUNNER_TEMP}/three-way-first.json"
          python scripts/evidence/verify_longitudinal_three_way_authority.py > "${RUNNER_TEMP}/three-way-second.json"
          diff -u "${RUNNER_TEMP}/three-way-first.json" "${RUNNER_TEMP}/three-way-second.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "three-way-first.json").read_text())
          boundary = payload["claim_boundary"]
          assert boundary["chronological_source_history_enforced"] is True
          assert boundary["nested_balanced_calibration_enforced"] is True
          assert boundary["final_assessment_separate_from_state_selection"] is True
          assert boundary["real_dataset_qualified"] is False
          assert boundary["calibration_reduction_qualified"] is False

          budgets = payload["calibration_budgets"]
          assert budgets
          assert len({item["calibration_budget_sha256"] for item in budgets}) == len(budgets)
          assert len({item["qualification_set_sha256"] for item in budgets}) == 1
          assert len({item["final_assessment_set_sha256"] for item in budgets}) == 1
          assert payload["authority"]["qualification_set_sha256"] == budgets[0]["qualification_set_sha256"]
          assert payload["authority"]["final_assessment_set_sha256"] == budgets[0]["final_assessment_set_sha256"]
          PY
      - name: Exercise evidence discovery and runner CLIs
        run: |
          neuros-foundation evidence
          neuros-foundation evidence --role longitudinal_bci --json
          neuros-foundation evidence --role cross_site_transfer --json
          python packages/neuros-foundation/examples/05_real_world_evidence.py
          python scripts/evidence/run_moabb_longitudinal.py --help
          python scripts/evidence/run_moabb_model_ladder.py --help
      - name: Compile three-way authority modules
        run: |
          python -m compileall -q \
            packages/neuros-foundation/src/neuros/foundation_models/longitudinal_three_way.py \
            packages/neuros-foundation/src/neuros/foundation_models/longitudinal_three_way_authority.py \
            scripts/evidence/verify_longitudinal_three_way_authority.py

  moabb-profile:
    name: MOABB evidence profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MOABB-backed evidence profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e packages/neuros-models
          python -m pip install -e "packages/neuros-foundation[evidence,dev]"
      - name: Verify external benchmark ecosystem and baseline runner
        run: |
          python - <<'PY'
          import moabb
          import moabb.datasets as datasets
          from moabb.paradigms import LeftRightImagery, MotorImagery
          from neuros.foundation_models import find_evidence_sources

          major, minor, *_ = (int(part) for part in moabb.__version__.split(".") if part.isdigit())
          assert (major, minor) >= (1, 5), moabb.__version__
          for name in ("Kumar2024", "Ma2020", "Lee2019_MI"):
              assert getattr(datasets, name, None) is not None, name

          assert LeftRightImagery().is_valid(datasets.Kumar2024())
          assert LeftRightImagery().is_valid(datasets.Lee2019_MI())
          assert MotorImagery(
              n_classes=2,
              events=["right_hand", "right_elbow"],
          ).is_valid(datasets.Ma2020())
          if getattr(datasets, "Wang2026", None) is not None:
              assert LeftRightImagery().is_valid(datasets.Wang2026())

          assert find_evidence_sources(ecosystem="MOABB")
          print(f"MOABB {moabb.__version__} evidence profile OK")
          PY
          pytest -q \
            packages/neuros-foundation/tests/test_real_world.py \
            packages/neuros-foundation/tests/test_longitudinal.py \
            packages/neuros-foundation/tests/test_longitudinal_three_way.py \
            packages/neuros-foundation/tests/test_longitudinal_runner.py
          python scripts/evidence/run_moabb_longitudinal.py --help

  model-ladder-profile:
    name: Longitudinal model ladder / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install complete local ladder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neuros-core
          python -m pip install -e "packages/neuros-models[dev]"
          python -m pip install -e packages/neuros-sourceweigher
          python -m pip install -e "packages/neuros-foundation[evidence,ladder,dev]"
      - name: Verify authority, task decoders, frozen transfer, and full bundle
        run: |
          pytest -q \
            packages/neuros-foundation/tests/test_longitudinal_authority.py \
            packages/neuros-foundation/tests/test_longitudinal_three_way_authority.py \
            packages/neuros-foundation/tests/test_longitudinal_methods.py \
            packages/neuros-foundation/tests/test_longitudinal_transfer.py \
            packages/neuros-foundation/tests/test_longitudinal_zero_calibration.py \
            packages/neuros-foundation/tests/test_longitudinal_model_identity.py \
            packages/neuros-foundation/tests/test_longitudinal_model_ladder.py
      - name: Exercise ladder CLI
        run: |
          python scripts/evidence/run_moabb_model_ladder.py --help
