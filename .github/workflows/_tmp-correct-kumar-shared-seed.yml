name: Temporary Kumar2024 shared-seed correction

on:
  push:
    branches:
      - feat/nsq-kumar2024-v1
    paths:
      - .github/workflows/_tmp-correct-kumar-shared-seed.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct preregistered split-seed semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/neuros/src/neuros/evidence/kumar2024.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"    case_seed = _stable_seed\(\n"
              r"\s+config\.split_seed,\n"
              r"\s+KUMAR2024_DATASET_ID,\n"
              r"\s+subject,\n"
              r"\s+target_session,\n"
              r"\s+\)\n"
          )
          replacement = (
              "    # The preregistered split seed is shared literally across every case.\n"
              "    # Subject/session identity is already bound by the case authority and must\n"
              "    # not be mixed into the split RNG seed.\n"
              "    case_seed = config.split_seed\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  f'expected exactly one Kumar2024 case-seed block, found {count}; refusing broad rewrite'
              )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit corrected authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/neuros/src/neuros/evidence/kumar2024.py
          git diff --cached --check
          git commit -m "Fix Kumar2024 shared split seed authority"
          git push origin HEAD:${GITHUB_REF_NAME}
