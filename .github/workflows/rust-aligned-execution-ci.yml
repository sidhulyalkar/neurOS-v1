name: Exact Aligned Execution CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/neuros-runtime/**"
      - "rust/neuros-runtime-py/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "scripts/ci_runtime_aligned_execution.py"
      - ".github/workflows/rust-aligned-execution-ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/neuros-runtime/**"
      - "rust/neuros-runtime-py/**"
      - "packages/neuros/src/neuros/dataset.py"
      - "packages/neuros/src/neuros/__init__.py"
      - "scripts/ci_runtime_aligned_execution.py"
      - ".github/workflows/rust-aligned-execution-ci.yml"

permissions:
  contents: read

env:
  RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: rust-aligned-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aligned-execution-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RUNTIME_SOURCE_SHA }}
          persist-credentials: false
      - name: Require exact clean runtime source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RUNTIME_SOURCE_SHA}"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build exact native wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.15.0"
          maturin build --release --manifest-path rust/neuros-runtime-py/Cargo.toml --interpreter python
      - name: Install exact native wheel and value inspector
        run: |
          python -m pip install target/wheels/*.whl
          python -m pip install "pyarrow==21.0.0"
      - name: Execute frozen exact plan adversarially
        run: python scripts/ci_runtime_aligned_execution.py
