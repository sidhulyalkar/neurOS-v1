name: Staging Runtime Process Worker v1

on:
  push:
    branches:
      - staging/runtime-process-worker-v1
    paths:
      - .github/workflows/_staging-runtime-process-worker-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging/runtime-process-worker-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Splice persistent worker into runtime executor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              return text.replace(old, new, 1)

          path = Path('packages/neuros-core/src/neuros/runtime/executor.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'from concurrent.futures import ProcessPoolExecutor\n',
              '',
              'pooled process import',
          )
          text = replace_once(
              text,
              'from neuros.runtime.graph import NodeKind, RuntimeEdge, RuntimeGraph, RuntimeNode\n',
              'from neuros.runtime.graph import NodeKind, RuntimeEdge, RuntimeGraph, RuntimeNode\n'
              'from neuros.runtime.process_worker import PersistentProcessWorker\n',
              'worker import',
          )
          text = replace_once(
              text,
              '    ``GPU`` is scheduled inline because the operator owns its framework/device\n'
              '    context; the label exists so graph specifications and telemetry preserve the\n'
              '    scheduling intent. ``PROCESS`` is opt-in because operators must be picklable.\n',
              '    ``GPU`` is scheduled inline because the operator owns its framework/device\n'
              '    context; the label exists so graph specifications and telemetry preserve the\n'
              '    scheduling intent. ``PROCESS`` owns one persistent direct child per runtime\n'
              '    node and requires an explicit hard execution timeout.\n',
              'execution class contract',
          )
          text = replace_once(
              text,
              '        self._event_queue: asyncio.Queue[RuntimeEvent] = asyncio.Queue()\n'
              '        self._process_pool: ProcessPoolExecutor | None = None\n'
              '        self._stopping = False\n',
              '        self._event_queue: asyncio.Queue[RuntimeEvent] = asyncio.Queue()\n'
              '        self._process_workers: dict[str, PersistentProcessWorker] = {}\n'
              '        self._process_receipts: dict[str, deque[dict[str, Any]]] = {\n'
              '            node_id: deque(maxlen=4096)\n'
              '            for node_id, node in graph.nodes.items()\n'
              '            if node.executor == "process"\n'
              '        }\n'
              '        self._stopping = False\n',
              'process worker state',
          )
          text = replace_once(
              text,
              '''    def _close_process_pool(self) -> None:
        """Release executor-owned process-pool authority on every terminal path.

        ``cancel_futures=True`` prevents queued work from starting. Python cannot
        forcibly terminate a function already executing inside a worker process,
        so this helper deliberately claims ownership release rather than process
        kill semantics.
        """

        if self._process_pool is None:
            return
        pool = self._process_pool
        self._process_pool = None
        pool.shutdown(wait=False, cancel_futures=True)
''',
              '''    async def _close_process_workers(self) -> None:
        """Close every executor-owned direct child before supervision completes."""

        workers = tuple(self._process_workers.values())
        if not workers:
            return
        await asyncio.gather(
            *(asyncio.to_thread(worker.close) for worker in workers),
            return_exceptions=True,
        )
''',
              'process cleanup implementation',
          )
          text = replace_once(
              text,
              '        finally:\n            self._close_process_pool()\n\n    async def _finish_successfully(self) -> None:\n',
              '        finally:\n            await self._close_process_workers()\n\n    async def _finish_successfully(self) -> None:\n',
              'supervisor cleanup',
          )
          text = replace_once(
              text,
              '        if self.state is not RuntimeState.STOPPED:\n'
              '            await self._transition(RuntimeState.STOPPED, "runtime_stopped")\n'
              '        self._close_process_pool()\n',
              '        if self.state is not RuntimeState.STOPPED:\n'
              '            await self._transition(RuntimeState.STOPPED, "runtime_stopped")\n',
              'success cleanup ownership',
          )
          text = replace_once(
              text,
              '            self._node_stats[culprit_id].failed += 1\n'
              '            if self.failure is None:\n'
              '                self.failure = RuntimeFailure(\n'
              '                    culprit_id, type(cause).__name__, str(cause)\n'
              '                )\n'
              '                await self._transition(\n'
              '                    RuntimeState.FAILED,\n'
              '                    "node_failed",\n'
              '                    node_id=culprit_id,\n'
              '                    error_type=type(cause).__name__,\n'
              '                    message=str(cause),\n'
              '                )\n',
              '            self._node_stats[culprit_id].failed += 1\n'
              '            error_type = str(\n'
              '                getattr(cause, "runtime_error_type", type(cause).__name__)\n'
              '            )\n'
              '            if self.failure is None:\n'
              '                self.failure = RuntimeFailure(culprit_id, error_type, str(cause))\n'
              '                await self._transition(\n'
              '                    RuntimeState.FAILED,\n'
              '                    "node_failed",\n'
              '                    node_id=culprit_id,\n'
              '                    error_type=error_type,\n'
              '                    message=str(cause),\n'
              '                )\n',
              'remote error identity',
          )
          text = replace_once(
              text,
              '''        if execution is ExecutionClass.PROCESS:
            if self._process_pool is None:
                self._process_pool = ProcessPoolExecutor()
            loop = asyncio.get_running_loop()
            return await loop.run_in_executor(
                self._process_pool, _call, func, item
            )
''',
              '''        if execution is ExecutionClass.PROCESS:
            timeout_s = node.execution_timeout_s
            if timeout_s is None:
                raise ValueError(
                    f"Process node {node.node_id} lacks execution_timeout_s"
                )
            method_name = getattr(func, "__name__", None)
            if (
                not isinstance(method_name, str)
                or not method_name
                or getattr(func, "__self__", None) is not node.operator
            ):
                raise TypeError(
                    f"Process node {node.node_id} requires a bound operator method"
                )
            worker = self._process_workers.get(node.node_id)
            if worker is None:
                worker = PersistentProcessWorker(
                    node.node_id,
                    node.operator,
                    execution_timeout_s=timeout_s,
                )
                self._process_workers[node.node_id] = worker
            receipts = self._process_receipts.setdefault(
                node.node_id, deque(maxlen=4096)
            )
            try:
                call = await worker.invoke(method_name, item)
                return call.result
            finally:
                receipt = worker.last_receipt
                if receipt is not None and (
                    not receipts
                    or receipts[-1].get("request_id") != receipt.request_id
                    or receipts[-1].get("generation") != receipt.generation
                ):
                    receipts.append(receipt.as_dict())
''',
              'process dispatch',
          )
          text = replace_once(
              text,
              '            self._close_process_pool()\n            return\n        if self.state is RuntimeState.CREATED:\n',
              '            await self._close_process_workers()\n            return\n        if self.state is RuntimeState.CREATED:\n',
              'failed stop cleanup',
          )
          text = replace_once(
              text,
              '            await self._transition(RuntimeState.STOPPED, "runtime_stopped")\n'
              '            self._close_process_pool()\n'
              '            return\n',
              '            await self._transition(RuntimeState.STOPPED, "runtime_stopped")\n'
              '            await self._close_process_workers()\n'
              '            return\n',
              'created stop cleanup',
          )
          text = replace_once(
              text,
              '        finally:\n'
              '            if self._completion_task is not None and self._completion_task.done():\n'
              '                self._close_process_pool()\n\n'
              '        if self.state is not RuntimeState.FAILED:\n',
              '        finally:\n'
              '            if self._completion_task is not None and self._completion_task.done():\n'
              '                await self._close_process_workers()\n\n'
              '        if self.state is not RuntimeState.FAILED:\n',
              'drain cleanup',
          )
          text = replace_once(
              text,
              '            "edges": edge_metrics,\n        }\n',
              '            "edges": edge_metrics,\n'
              '            "process_receipts": {\n'
              '                node_id: list(receipts)\n'
              '                for node_id, receipts in self._process_receipts.items()\n'
              '            },\n'
              '        }\n',
              'semantic receipts snapshot',
          )
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_runtime_execution_authority.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = replace_once(
              test_text,
              '''def test_process_executor_is_rejected_until_per_node_worker_is_authoritative():
    with pytest.raises(ValueError, match="not authoritative"):
        RuntimeNode("transform", NodeKind.TRANSFORM, object(), executor="process")
''',
              '''def test_process_executor_requires_explicit_hard_timeout():
    with pytest.raises(ValueError, match="execution_timeout_s"):
        RuntimeNode("transform", NodeKind.TRANSFORM, object(), executor="process")
    node = RuntimeNode(
        "transform",
        NodeKind.TRANSFORM,
        object(),
        executor="process",
        execution_timeout_s=1.0,
    )
    assert node.execution_timeout_s == 1.0
''',
              'phase A process expectation',
          )
          test_path.write_text(test_text, encoding='utf-8')
          PY

          git diff --check
          python -m compileall -q packages/neuros-core/src/neuros/runtime tests/test_runtime_execution_authority.py tests/test_runtime_process_authority.py
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/neuros-core[test]'
          python -m pytest -q tests/test_runtime_executor.py tests/test_runtime_queues.py tests/test_runtime_fault_qualification.py tests/test_runtime_fusion_cancellation.py tests/test_runtime_execution_authority.py tests/test_runtime_process_authority.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/neuros-core/src/neuros/runtime/executor.py tests/test_runtime_execution_authority.py
          git commit -m 'feat(runtime): stage process worker integration'
          git push origin HEAD:${GITHUB_REF_NAME}
