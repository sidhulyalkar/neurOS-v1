name: Staging Runtime Process Worker v1

on:
  push:
    branches:
      - staging/runtime-process-worker-v1

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging/runtime-process-worker-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply process worker integration
        run: |
          python .staging/runtime_process_worker_patch.py
          python .staging/runtime_process_worker_fixes.py
      - name: Validate source and targeted runtime contracts
        run: |
          git diff --check
          python -m compileall -q packages/neuros-core/src/neuros/runtime tests/test_runtime_execution_authority.py tests/test_runtime_fault_qualification.py tests/test_runtime_process_authority.py
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/neuros-core[test]'
          python -m pytest -q tests/test_runtime_executor.py tests/test_runtime_queues.py tests/test_runtime_fault_qualification.py tests/test_runtime_fusion_cancellation.py tests/test_runtime_execution_authority.py tests/test_runtime_process_authority.py
      - name: Persist validated staging blobs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/neuros-core/src/neuros/runtime/executor.py packages/neuros-core/src/neuros/runtime/process_worker.py tests/test_runtime_execution_authority.py tests/test_runtime_fault_qualification.py
          if git diff --cached --quiet; then
            echo 'No integration diff to persist.'
            exit 0
          fi
          git commit -m 'feat(runtime): stage process worker integration'
          git push origin HEAD:${GITHUB_REF_NAME}
