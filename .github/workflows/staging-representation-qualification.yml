name: Staging Representation Qualification

on:
  push:
    branches:
      - staging/tphate-representation-v1
    paths:
      - ".github/workflows/staging-representation-qualification.yml"
      - "packages/neuros-mechint/src/neuros_mechint/representations/**"
      - "packages/neuros-mechint/tests/test_mechint_representations.py"
      - "packages/neuros-mechint/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/neuros-core/pyproject.toml
            packages/neuros-mechint/pyproject.toml
      - name: Install representation qualification surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/neuros-core[test]"
          python -m pip install -e "packages/neuros-mechint"
          python -m pip check
      - name: Compile representation modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q packages/neuros-mechint/src/neuros_mechint/representations
      - name: Exercise representation authority
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q packages/neuros-mechint/tests/test_mechint_representations.py
