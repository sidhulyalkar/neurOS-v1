name: Bootstrap aligned Python surface

on:
  push:
    branches:
      - feat/rust-aligned-execution-v1
    paths:
      - "scripts/_bootstrap_aligned_python.py"
      - ".github/workflows/bootstrap-aligned-python.yml"

permissions:
  contents: write

jobs:
  integrate-python-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Integrate aligned Python surface
        run: python scripts/_bootstrap_aligned_python.py
      - name: Qualify staged Rust and Python syntax
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p neuros-runtime --all-features
          python -m compileall -q packages/neuros/src/neuros/dataset.py packages/neuros/src/neuros/__init__.py
      - name: Publish aligned Python tranche
        run: |
          set -euo pipefail
          git config user.name "neurOS integration bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bootstrap-aligned-python.yml scripts/_bootstrap_aligned_python.py
          git add rust/neuros-runtime-py/src/lib.rs packages/neuros/src/neuros/dataset.py packages/neuros/src/neuros/__init__.py .github/workflows/rust-runtime-ci.yml
          git commit -m "feat(runtime): expose exact aligned execution to Python"
          git push origin HEAD:feat/rust-aligned-execution-v1
