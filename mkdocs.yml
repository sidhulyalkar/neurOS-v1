site_name: neurOS Documentation
site_description: Reliable neural runtime and ORION representation research
site_author: neurOS Development Team
repo_name: sidhulyalkar/neurOS-v1
repo_url: https://github.com/sidhulyalkar/neurOS-v1
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Project Status: PROJECT_STATUS.md
  - Real-World Evidence:
      - Evidence Program: REAL_WORLD_EVIDENCE.md
      - Ranked Source Map: EVIDENCE_SOURCE_MAP.md
      - Longitudinal EEG Showcase: LONGITUDINAL_EEG_SHOWCASE.md
  - Installation: getting-started/installation.md
  - Architecture: ARCHITECTURE.md
  - API Surface: API_REFERENCE.md
  - Neurotokenization Research:
      - Master Plan: neurotokenization/00_MASTER_PLAN.md
      - Tokenizer Specs: neurotokenization/01_TOKENIZER_SPECS.md
      - Evaluation Protocol: neurotokenization/02_EVALUATION_PROTOCOL.md
      - Implementation Sprints: neurotokenization/03_IMPLEMENTATION_SPRINTS.md
  - Historical Archive: archive/README.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sidhulyalkar/neurOS-v1
