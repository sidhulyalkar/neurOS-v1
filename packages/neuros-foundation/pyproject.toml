[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuros-foundation"
version = "2.0.0"
description = "Adapters and integrations for external neural representation and foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neurOS Development Team"}]
keywords = ["neuroscience", "foundation-models", "poyo", "ndt", "cebra", "neuroformer", "transfer-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "neuros-core>=2.0.0",
    "neuros-models>=2.0.0",
    "numpy>=1.24.0",
    "torch>=2.1.0",
]

[project.optional-dependencies]
cebra = ["cebra>=0.3.0"]
allen = ["allensdk>=2.15.0"]
all = ["cebra>=0.3.0"]

[project.urls]
Homepage = "https://github.com/sidhulyalkar/neurOS-v1"
Repository = "https://github.com/sidhulyalkar/neurOS-v1"
Issues = "https://github.com/sidhulyalkar/neurOS-v1/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuros*"]
namespaces = true

[tool.setuptools.package-data]
neuros = ["py.typed"]
