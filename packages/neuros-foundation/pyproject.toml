[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuros-foundation"
version = "2.1.0"
description = "Interoperability, catalog, probes, and fair benchmarks for neural foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neurOS Development Team"}]
keywords = [
    "neuroscience",
    "foundation-models",
    "eeg",
    "brain-computer-interface",
    "neural-decoding",
    "representation-learning",
    "benchmarking",
    "poyo",
    "ndt",
    "cebra",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "neuros-core>=2.0.0",
    "neuros-models>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
zuna = ["zuna"]
cebra = ["cebra>=0.3.0"]
allen = ["allensdk>=2.15.0"]
legacy = ["torch>=2.1.0"]
eeg = ["mne>=1.6.0"]
evidence = ["moabb>=1.5.0,<2"]
ladder = ["torch>=2.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
all = [
    "torch>=2.1.0",
    "cebra>=0.3.0",
    "zuna",
    "mne>=1.6.0",
    "moabb>=1.5.0,<2",
    "allensdk>=2.15.0",
]

[project.scripts]
neuros-foundation = "neuros.foundation_models.cli:main"

[project.urls]
Homepage = "https://github.com/sidhulyalkar/neurOS-v1"
Repository = "https://github.com/sidhulyalkar/neurOS-v1"
Issues = "https://github.com/sidhulyalkar/neurOS-v1/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuros*"]
namespaces = true

[tool.setuptools.package-data]
neuros = ["py.typed"]
