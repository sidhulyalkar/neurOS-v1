[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuros-models"
version = "2.1.0"
description = "Task-specific neural decoders with mechanistic analysis contracts for neurOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neurOS Development Team"}]
keywords = [
    "neuroscience",
    "brain-computer-interface",
    "eeg",
    "neural-decoding",
    "mechanistic-interpretability",
    "eegnet",
    "transformer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "neuros-core>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
pytorch = ["torch>=2.1.0"]
mechint = [
    "torch>=2.1.0",
    "neuros-mechint>=1.0.0",
]
dev = [
    "torch>=2.1.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = [
    "torch>=2.1.0",
    "neuros-mechint>=1.0.0",
]
test = ["pytest>=7.4"]

[project.entry-points."neuros.decoders"]
threshold = "neuros.models.threshold_decoder:ThresholdDecoder"
simple = "neuros.models.simple_classifier:SimpleClassifier"
random_forest = "neuros.models.random_forest_model:RandomForestModel"
svm = "neuros.models.svm_model:SVMModel"
knn = "neuros.models.knn_model:KNNModel"
gbdt = "neuros.models.gbdt_model:GBDTModel"
eegnet = "neuros.models.eegnet_model:EEGNetModel"
cnn = "neuros.models.cnn_model:CNNModel"
transformer = "neuros.models.transformer_model:TransformerModel"
eeg_conformer = "neuros.models.eeg_conformer_model:EEGConformerModel"
attention_fusion = "neuros.models.attention_fusion_model:AttentionFusionModel"

[project.scripts]
neuros-models = "neuros.models.cli:main"

[project.urls]
Homepage = "https://github.com/sidhulyalkar/neurOS-v1/tree/main/packages/neuros-models"
Repository = "https://github.com/sidhulyalkar/neurOS-v1"
Issues = "https://github.com/sidhulyalkar/neurOS-v1/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuros*"]
namespaces = true

[tool.setuptools.package-data]
neuros = ["py.typed"]
