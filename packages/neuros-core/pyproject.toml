[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuros-core"
version = "2.0.0"
description = "Core runtime, processing, contracts, and orchestration for neurOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neurOS Development Team"}]
keywords = ["neuroscience", "bci", "brain-computer-interface", "runtime", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=1.10.10,<3",
]

[project.optional-dependencies]
evaluation = ["scikit-learn>=1.2"]
zarr = ["zarr>=2.16,<3"]
nwb = ["pynwb>=2.5"]
recording = ["zarr>=2.16,<3", "pynwb>=2.5"]
test = ["pytest>=7.4", "pytest-asyncio>=0.21", "scikit-learn>=1.2"]
dev = [
    "neuros-core[evaluation,test]",
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.entry-points."neuros.transforms"]
bandpass = "neuros.processing.plugin_transforms:BandpassTransform"
smoothing = "neuros.processing.plugin_transforms:SmoothingTransform"
bandpower = "neuros.processing.plugin_transforms:BandPowerTransform"
window = "neuros.processing.plugin_transforms:NeuralWindowTransform"

[project.urls]
Homepage = "https://github.com/sidhulyalkar/neurOS-v1"
Documentation = "https://github.com/sidhulyalkar/neurOS-v1/tree/main/docs"
Repository = "https://github.com/sidhulyalkar/neurOS-v1"
Issues = "https://github.com/sidhulyalkar/neurOS-v1/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuros*"]
namespaces = true

[tool.setuptools.package-data]
neuros = ["py.typed"]
