[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuros-mechint"
version = "1.0.0"
description = "Reproducible causal experiments for neural and artificial model mechanisms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neurOS Development Team"}]
keywords = [
    "mechanistic interpretability",
    "causal interventions",
    "circuit faithfulness",
    "held-out validation",
    "evidence packs",
    "factorial experiments",
    "feature correspondence",
    "causal substitution",
    "hierarchical bootstrap",
    "replication",
    "dose response",
    "reproducibility",
    "neural networks",
    "neuroscience",
    "foundation models",
    "neural tokenization",
    "neural representations",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "neuros-core>=2.0.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]
orion = ["neuros-orion>=0.1.0"]
neurofm = [
    "neuros-orion>=0.1.0",
    "neuros-neurofm>=0.1.0",
]
transformer-lens = ["transformer-lens>=3.0,<4"]
nnsight = ["nnsight>=0.7,<0.8"]
sae-lens = ["sae-lens>=6,<7"]
ecosystem = [
    "transformer-lens>=3.0,<4",
    "nnsight>=0.7,<0.8",
    "sae-lens>=6,<7",
]
legacy = [
    "scikit-learn>=1.2.0",
    "tqdm>=4.65.0",
    "h5py>=3.8.0",
    "einops>=0.6.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "bokeh>=3.3.0",
    "networkx>=3.0",
    "plotly>=5.14.0",
    "umap-learn>=0.5.3",
    "pandas>=2.0.0",
]
neuro = [
    "fastdtw>=0.3.4",
    "gudhi>=3.8.0",
    "PyWavelets>=1.4.0",
]
tutorial-ci = [
    "ipykernel>=6.23.0",
    "nbclient>=0.10.0",
    "nbformat>=5.9.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.23.0",
    "ipywidgets>=8.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.9.0",
]
all = ["neuros-mechint[dev,orion,neurofm,ecosystem,legacy,viz,neuro,notebooks]"]

[project.scripts]
neuros-mechint = "neuros_mechint.cli:main"

[project.urls]
Homepage = "https://github.com/sidhulyalkar/neurOS-v1/tree/main/packages/neuros-mechint"
Repository = "https://github.com/sidhulyalkar/neurOS-v1"
Issues = "https://github.com/sidhulyalkar/neurOS-v1/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/neuros_mechint/benchmarks/evidence_pack.py" = ["TRY004"]
"src/neuros_mechint/benchmarks/correspondence.py" = ["TRY004"]
"src/neuros_mechint/benchmarks/replication.py" = ["TRY004"]
"src/neuros_mechint/benchmarks/factorial.py" = ["SIM102", "TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_mechint_*.py"]
addopts = ["-q"]
markers = [
    "legacy: historical tests retained for reference while APIs are migrated",
    "slow: tests that are not part of the default scientific smoke suite",
    "orion: tests requiring the ORION optional integration",
    "ecosystem: tests requiring optional external interpretability packages",
]
