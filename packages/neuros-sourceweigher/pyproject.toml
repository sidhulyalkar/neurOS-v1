[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuros-sourceweigher"
version = "0.2.0"
description = "Reliability-aware source selection, domain adaptation, and fusion for neurOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neurOS Development Team"}]
keywords = [
    "neuroscience",
    "bci",
    "domain-adaptation",
    "transfer-learning",
    "source-weighting",
    "sensor-fusion",
    "distribution-shift",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
service = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.8",
]
all = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://github.com/sidhulyalkar/neurOS-v1"
Repository = "https://github.com/sidhulyalkar/neurOS-v1"
Issues = "https://github.com/sidhulyalkar/neurOS-v1/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
