[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuros"
version = "2.1.0"
description = "User-facing SDK and CLI for the neurOS neural execution and evidence platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neurOS Development Team"}]
keywords = ["neuroscience", "bci", "brain-computer-interface", "eeg", "neural-decoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "neuros-core>=2.0.0",
    "neuros-drivers>=2.0.0",
    "neuros-models>=2.0.0",
]

[project.optional-dependencies]
all = [
    "neuros-foundation>=2.0.0",
    "neuros-sourceweigher>=0.2.0",
    "neuros-ui>=2.0.0",
    "neuros-cloud>=2.0.0",
    "mne>=1.6",
]
bci = [
    "neuros-drivers[eeg]>=2.0.0",
    "neuros-models[pytorch]>=2.0.0",
    "neuros-ui[dashboard]>=2.0.0",
]
braindecode = ["neuros-models[braindecode]>=2.1.0; python_version >= '3.11'"]
recording = ["neuros-core[recording]>=2.0.0"]
research = [
    "neuros-models[all]>=2.0.0",
    "neuros-foundation[all]>=2.0.0",
    "neuros-sourceweigher>=0.2.0",
]
evidence = [
    "neuros-foundation[evidence]>=2.1.0",
    "neuros-orion>=0.1.0",
]
evidence-braindecode = [
    "neuros-foundation[evidence,braindecode-evidence]>=2.1.0; python_version >= '3.11'",
    "neuros-orion>=0.1.0; python_version >= '3.11'",
]
deployment = [
    "neuros-ui[all]>=2.0.0",
    "neuros-cloud[all]>=2.0.0",
]
orion = ["neuros-orion>=0.1.0"]
interop = ["mne>=1.6"]
interop-mne = ["mne>=1.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.scripts]
neuros = "neuros.cli:main"
neuros-nsq-kumar2024 = "neuros.evidence.kumar2024:main"

[project.urls]
Homepage = "https://github.com/sidhulyalkar/neurOS-v1"
Documentation = "https://github.com/sidhulyalkar/neurOS-v1/tree/main/docs"
Repository = "https://github.com/sidhulyalkar/neurOS-v1"
Issues = "https://github.com/sidhulyalkar/neurOS-v1/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuros*"]
namespaces = true

[tool.setuptools.package-data]
neuros = ["py.typed"]
