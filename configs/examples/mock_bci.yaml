schema_version: 1

metadata:
  name: mock-bci-smoke
  purpose: executable configuration/plugin/runtime smoke test

streams:
  - id: eeg
    source:
      plugin: mock
      options:
        sampling_rate: 250.0
        channels: 8
    transforms:
      - plugin: smoothing
        options:
          window_size: 3

decoder:
  plugin: threshold
  options:
    threshold: 0.0

runtime:
  queue_capacity: 16
  overflow_policy: drop_oldest

sinks: []
monitors: []
